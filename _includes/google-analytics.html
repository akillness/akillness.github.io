<script>
  (function () {
    const key = 'analytics-consent';
    const cleanupKey = 'analytics-cookie-cleanup-incomplete';
    const measurementId = {{ site.google_analytics.id | jsonify }};
    const settings = document.getElementById('analytics-settings');
    const panel = document.getElementById('analytics-consent');
    const accept = document.getElementById('analytics-accept');
    const decline = document.getElementById('analytics-decline');
    const status = document.getElementById('analytics-consent-status');
    if (!settings || !panel || !accept || !decline || !status) return;

    let choice;
    try { choice = localStorage.getItem(key); } catch (error) { choice = null; }
    let loaded = false;

    function open() {
      panel.hidden = false;
      settings.setAttribute('aria-expanded', 'true');
    }

    function close() {
      panel.hidden = true;
      settings.setAttribute('aria-expanded', 'false');
      settings.focus();
    }

    function save(value) {
      try {
        localStorage.setItem(key, value);
        return localStorage.getItem(key) === value;
      } catch (error) {
        return false;
      }
    }

    function loadAnalytics() {
      if (loaded) return;
      loaded = true;
      window['ga-disable-' + measurementId] = false;
      window.gtag('js', new Date());
      window.gtag('config', measurementId);
      const script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
      document.head.appendChild(script);
    }

    function clearAnalyticsCookies() {
      try {
        const domains = location.hostname.split('.');
        const paths = location.pathname.split('/');
        const cookieNames = document.cookie.split(';').map(function (cookie) { return cookie.trim().split('=')[0]; });
        cookieNames.filter(function (name) { return name === '_ga' || name.indexOf('_ga_') === 0; }).forEach(function (name) {
          for (let i = 0; i < domains.length; i++) {
            for (let j = paths.length; j > 0; j--) {
              const path = paths.slice(0, j).join('/') || '/';
              document.cookie = name + '=; Max-Age=0; path=' + path + '; domain=' + domains.slice(i).join('.');
              document.cookie = name + '=; Max-Age=0; path=' + path;
            }
          }
        });
        return !document.cookie.split(';').some(function (cookie) {
          const name = cookie.trim().split('=')[0];
          return name === '_ga' || name.indexOf('_ga_') === 0;
        });
      } catch (error) {
        return false;
      }
    }

    function markCleanupIncomplete() {
      try { sessionStorage.setItem(cleanupKey, '1'); } catch (error) { /* Storage blocked; the warning cannot persist. */ }
    }

    settings.addEventListener('click', function () {
      if (panel.hidden) { open(); accept.focus(); } else { close(); }
    });
    accept.addEventListener('click', function () {
      if (!save('granted')) {
        status.textContent = loaded ? 'Your choice could not be saved. Check your browser storage settings.' : 'Your choice could not be saved. Analytics remains off; check your browser storage settings.';
        return;
      }
      choice = 'granted';
      status.textContent = '';
      loadAnalytics();
      close();
    });
    decline.addEventListener('click', function () {
      window['ga-disable-' + measurementId] = true;
      if (!clearAnalyticsCookies()) markCleanupIncomplete();
      if (!save('denied')) {
        status.textContent = 'Your choice could not be saved. Analytics is disabled on this page; clear site data in your browser before returning.';
        return;
      }
      if (loaded || choice === 'granted') {
        location.reload();
        return;
      }
      choice = 'denied';
      status.textContent = '';
      close();
    });

    window.addEventListener('storage', function (event) {
      try { if (event.storageArea && event.storageArea !== localStorage) return; } catch (error) { /* Fail closed. */ }
      if (loaded && (event.key === null || (event.key === key && event.newValue !== 'granted'))) {
        window['ga-disable-' + measurementId] = true;
        if (!clearAnalyticsCookies()) markCleanupIncomplete();
        location.reload();
      }
    });

    let cleanupIncomplete = false;
    try {
      cleanupIncomplete = sessionStorage.getItem(cleanupKey) === '1';
      sessionStorage.removeItem(cleanupKey);
    } catch (error) { cleanupIncomplete = false; }
    if (choice !== 'granted' && !clearAnalyticsCookies()) cleanupIncomplete = true;
    if (cleanupIncomplete) {
      open();
      status.textContent = 'Some analytics cookies could not be removed in this browser. Clear this site\'s data in your browser settings.';
    }
    if (choice === 'granted') loadAnalytics();
    else if (choice !== 'denied') open();
  })();
</script>
