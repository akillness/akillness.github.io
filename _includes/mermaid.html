<!-- Mermaid is discovered on demand instead of joining the blocking page bundle. -->
<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function () {
    const codeBlocks = Array.from(document.querySelectorAll('pre > code.language-mermaid'));

    if (codeBlocks.length === 0) {
      return;
    }

    const html = document.documentElement;
    const backups = [];
    const diagrams = [];
    let mermaidReady = false;
    let mermaidLoading = false;
    let currentTheme =
      (html.hasAttribute('data-mode') && html.getAttribute('data-mode') === 'dark') ||
      (!html.hasAttribute('data-mode') && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark'
        : 'default';

    codeBlocks.forEach(function (codeBlock) {
      const backup = codeBlock.parentElement;

      if (backup.classList.contains('unloaded')) {
        return;
      }

      const diagram = document.createElement('pre');
      diagram.className = 'mermaid';
      diagram.dataset.mermaidSource = codeBlock.textContent;
      diagram.textContent = codeBlock.textContent;
      backup.classList.add('unloaded');
      backup.after(diagram);
      backups.push(backup);
      diagrams.push(diagram);
    });

    function renderMermaid() {
      window.mermaid.initialize({ theme: currentTheme });
      window.mermaid.init(undefined, '.mermaid');
    }

    function recoverSource() {
      diagrams.forEach(function (diagram) {
        diagram.remove();
      });
      backups.forEach(function (backup) {
        backup.classList.remove('unloaded');
      });
    }

    function loadMermaid() {
      if (mermaidReady) {
        renderMermaid();
        return;
      }

      if (mermaidLoading) {
        return;
      }

      mermaidLoading = true;
      const script = document.createElement('script');
      script.src = '{{ site.data.origin[type].mermaid.js | relative_url }}';
      script.async = true;
      script.onload = function () {
        mermaidReady = true;
        mermaidLoading = false;
        renderMermaid();
      };
      script.onerror = function () {
        mermaidLoading = false;
        recoverSource();
      };
      document.head.appendChild(script);
    }

    function updateMermaid(event) {
      if (
        typeof ModeToggle === 'undefined' ||
        event.source !== window ||
        !event.data ||
        event.data.direction !== ModeToggle.ID
      ) {
        return;
      }

      currentTheme = event.data.message === ModeToggle.DARK_MODE ? 'dark' : 'default';

      if (!mermaidReady) {
        return;
      }

      diagrams.forEach(function (diagram) {
        diagram.removeAttribute('data-processed');
        diagram.textContent = diagram.dataset.mermaidSource;
      });
      renderMermaid();
    }

    window.addEventListener('message', updateMermaid);

    if (diagrams.length === 0) {
      return;
    }

    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(
        function (entries, currentObserver) {
          if (entries.some(function (entry) { return entry.isIntersecting; })) {
            currentObserver.disconnect();
            loadMermaid();
          }
        },
        { rootMargin: '800px 0px' }
      );
      observer.observe(diagrams[0]);
    } else {
      loadMermaid();
    }
  });
</script>
