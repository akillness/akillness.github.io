<!--
  Jekyll Simple Search loader
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>

  Search code and data load only after a visitor types. The small metadata index
  answers title/tag queries first; the full-text index is fetched only when that
  lightweight result set has no match.
-->

{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2><a href="{url}">{title}</a></h2>
      <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1">
        {categories}
        {tags}
      </div>
    </header>
    <p>{snippet}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var input = document.getElementById('search-input');
    var results = document.getElementById('search-results');

    if (input === null || results === null) {
      return;
    }

    var META_URL = '{{ '/assets/js/data/search-meta.json' | relative_url }}';
    var FULL_URL = '{{ '/assets/js/data/search.json' | relative_url }}';
    var SEARCH_LIBRARY = '{{ site.data.origin[type].search.js | relative_url }}';
    var metaSearcher = null;
    var fullSearcher = null;
    var libraryPromise = null;
    var metaPromise = null;
    var fullPromise = null;
    var metaState = 'idle';
    var fullState = 'idle';
    var inputTimer = null;

    var options = {
      resultsContainer: results,
      searchResultTemplate: '{{ result_elem | strip_newlines }}',
      noResultsText: '{{ not_found }}',
      templateMiddleware: function (prop, value, template) {
        if (prop === 'categories') {
          if (value === '') {
            return `${value}`;
          }
          return `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
        }

        if (prop === 'tags') {
          if (value === '') {
            return `${value}`;
          }
          return `<div><i class="fa fa-tag fa-fw"></i>${value}</div>`;
        }
      }
    };

    function loadLibrary() {
      if (window.SimpleJekyllSearch) {
        return Promise.resolve();
      }

      if (libraryPromise !== null) {
        return libraryPromise;
      }

      libraryPromise = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = SEARCH_LIBRARY;
        script.async = true;
        script.onload = resolve;
        script.onerror = function () {
          reject(new Error('failed to load search library'));
        };
        document.head.appendChild(script);
      });

      return libraryPromise;
    }

    /* SimpleJekyllSearch binds its own input listener on every call. Point it at
       a detached element and drive queries here so replacing an index does not
       duplicate page-level listeners. */
    function build(index) {
      options.searchInput = document.createElement('input');
      options.json = index;
      return window.SimpleJekyllSearch(options).search;
    }

    function fetchIndex(url) {
      return fetch(url).then(function (res) {
        if (!res.ok) {
          throw new Error('failed to get ' + url + ' (' + res.status + ')');
        }
        return res.json();
      });
    }

    function loadMeta() {
      if (metaState === 'ready') {
        return Promise.resolve();
      }

      if (metaState === 'loading') {
        return metaPromise;
      }

      metaState = 'loading';
      metaPromise = Promise.all([loadLibrary(), fetchIndex(META_URL)])
        .then(function (values) {
          metaSearcher = build(values[1]);
          metaState = 'ready';
        })
        .catch(function (err) {
          metaState = 'idle';
          throw err;
        });

      return metaPromise;
    }

    function loadFull() {
      if (fullState === 'ready') {
        return Promise.resolve();
      }

      if (fullState === 'loading') {
        return fullPromise;
      }

      fullState = 'loading';
      fullPromise = fetchIndex(FULL_URL)
        .then(function (index) {
          fullSearcher = build(index);
          fullState = 'ready';
        })
        .catch(function (err) {
          fullState = 'idle';
          throw err;
        });

      return fullPromise;
    }

    function runQuery(searcher) {
      var query = input.value.trim();
      results.innerHTML = '';

      if (searcher === null || query === '') {
        return false;
      }

      searcher(query);
      return results.querySelector('article') !== null;
    }

    function search() {
      var query = input.value.trim();

      if (query === '') {
        results.innerHTML = '';
        results.removeAttribute('aria-busy');
        return;
      }

      if (fullSearcher !== null) {
        runQuery(fullSearcher);
        return;
      }

      loadMeta()
        .then(function () {
          if (input.value.trim() !== query) {
            return;
          }

          if (runQuery(metaSearcher)) {
            return;
          }

          results.setAttribute('aria-busy', 'true');
          return loadFull()
            .then(function () {
              if (input.value.trim() === query) {
                runQuery(fullSearcher);
              }
            })
            .finally(function () {
              results.removeAttribute('aria-busy');
            });
        })
        .catch(function (err) {
          console.error(err);
          results.removeAttribute('aria-busy');
        });
    }

    input.addEventListener('input', function () {
      window.clearTimeout(inputTimer);
      inputTimer = window.setTimeout(search, 120);
    });
  });
</script>
