version: 1
timezone: Asia/Seoul
schedule_local: "01:00"
scheduler: Aside cron
routine_name: Daily Source Audit Publish
language: en
publication_mode: publish-on-green
standing_publish_approval: true
max_articles_per_run: 1
max_revision_loops: 2
minimum_primary_sources: 1
minimum_material_claim_coverage: 1.0
minimum_reference_images: 4 # legacy manifests only
image_selection_policy: source-first-fallback
image_selection_scope: akillness-git-blog-only
maximum_reference_images: 12
source_image_contract_effective_date: "2026-09-01"
reference_image_max_bytes: 5242880
reference_image_max_total_bytes: 20971520
reference_image_require_raster_signature: true
reference_image_require_metadata_stripped: true
reference_image_min_pixels: 16384
reference_image_min_short_side: 32
reference_image_manifest: _workspace/current/draft/source-image-manifest.json
reference_image_downloader: editorial-director
reference_image_license_bases:
  - public-domain
  - cc0
  - cc-by
  - cc-by-sa
  - kogl-type-1
  - repo-license-covers-assets
  - official-press-kit
reference_image_first_party_basis: own-screenshot-of-public-interface
reference_image_first_party_scope: akillness-git-blog-only
reference_image_first_party_article_stems:
  - 2026-10-01-d073-proposal-commit-gate-trace
reference_image_first_party_source_page_urls:
  - "https://sealed-lighthouse-trace-rpg.vercel.app/dashboard/"
reference_image_first_party_owner: "akillness / neural_symbolic_in_game project"
reference_image_first_party_owner_reuse_attestation: "The project owner explicitly approved these archived public-dashboard captures for reuse in this akillness Git blog draft only; no third-party license is implied."
allow_empty_success: true
authority_contract_version: 1
authority_brief_path: _workspace/current/research/authority-brief.json
authority_site_mode: expert-source-audit
authority_operating_mode: acquisition-content
authority_primary_lane: seo-and-content
authority_revenue_model: ads-and-paid-technical-review
authority_readout_after_days: 28
authority_result_status_at_publish: not-measured
canonical_format: Source Audit
content_pillars:
  - ai-agents-and-harness-engineering
  - mcp-reliability-security-and-operations
  - unity-and-game-production-automation
  - multimodal-game-qa-and-3d-vision
publication_scope:
  allowed:
    - "_posts/YYYY-MM-DD-<slug>.md"
    - "assets/img/posts/YYYY-MM-DD-<slug>/**"
  forbidden:
    - ".github/**"
    - "_config.yml"
    - ".claude/**"
    - "tools/**"
    - "CLAUDE.md"
    - "AGENTS.md"
standing_constraints:
  - no-newsletter-form-until-privacy-policy-update
  - no-paid-backlinks
  - no-seo-guest-posts
  - no-undisclosed-sponsorship
  - no-fabricated-first-hand-experience
  - no-transcript-rewrite-articles
  - no-scaled-content-automation
  - no-unverified-outcome-claims
  - no-publish-without-green-gates
  - no-templated-heading-skeleton
  - no-per-post-ai-disclaimer-boilerplate
  - no-new-top-level-category-without-owner-decision
# Low-value-content standard (AdSense policy alignment, 2026-10-14).
# Scheduled runs happen on these days only, at most max_articles_per_run each.
schedule_days:
  - Tuesday
  - Friday
low_value_content_policy_version: 2026-10-14
low_value_content_checks:
  - reliable-high-quality-information-tools-or-services
  - ongoing-content-curation-and-structural-maintenance
  - genuine-user-interest
heading_style: natural-finding-specific
forbidden_heading_patterns:
  - emoji-led-h2
  - curiosity-retrieve-innovation-stage-labels
  - duplicate-h2
required_closing_sections:
  - Key Takeaways
  - New Questions
  - References
ai_disclosure_surface: site-level
ai_disclosure_path: /about/#editorial-method-and-ai-assistance
category_allowlist:
  - "AI, Agents"
  - "AI, Research"
  - "AI, Tooling"
restored_archive_policy: labeled-non-commercial-outside-editorial-cohort
# Archive development program (owner instruction 2026-10-14): rebuild each
# restored archive note with a fresh survey and primary-source research, then
# publish it and graduate it out of the archive exception. Ledger and contract:
# _data/archive_development.json, tools/validate-archive-development.mjs,
# .claude/skills/archive-development/SKILL.md
archive_development_program_id: archive-development-2026-10-14
archive_development_mode: publish-on-green
archive_development_max_posts_per_run: 2
archive_development_schedule_local: "03:30"
archive_development_schedule_days:
  - Monday
  - Tuesday
  - Wednesday
  - Thursday
  - Friday
  - Saturday
  - Sunday
