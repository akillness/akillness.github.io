<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeong Jang-young | AI Product Engineering Portfolio</title>
    <meta
      name="description"
      content="Selected project portfolio of Jeong Jang-young, an AI product engineer — from game AI, reinforcement learning, and procedural generation to multimodal AutoQA, on-device agents, and production RAG/agentic systems (SAGA, Millie)."
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jeong Jang-young | AI Product Engineering Portfolio">
    <meta property="og:description" content="Selected project portfolio — from game AI, reinforcement learning, and procedural generation to multimodal AutoQA, on-device agents, and production RAG/agentic systems.">
    <meta property="og:image" content="https://akillness.github.io/portfolio/assets/og-portfolio.png">
    <meta property="og:url" content="https://akillness.github.io/portfolio/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Jeong Jang-young | AI Product Engineering Portfolio">
    <meta name="twitter:description" content="Selected project portfolio — from game AI to production RAG/agentic systems.">
    <meta name="twitter:image" content="https://akillness.github.io/portfolio/assets/og-portfolio.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        --paper: #f5efe3;
        --paper-strong: #fffaf1;
        --surface: rgba(255, 250, 241, 0.78);
        --surface-strong: rgba(255, 251, 244, 0.95);
        --ink: #1f2430;
        --muted: #5e636d;
        --line: rgba(31, 36, 48, 0.12);
        --accent: #e7692e;
        --accent-soft: rgba(231, 105, 46, 0.12);
        --accent-deep: #a6461e;
        --accent-alt: #1f7a72;
        --shadow: 0 24px 80px rgba(31, 36, 48, 0.12);
        --shadow-soft: 0 16px 36px rgba(31, 36, 48, 0.08);
        --radius-xl: 34px;
        --radius-lg: 24px;
        --radius-md: 18px;
        --page-width: 1180px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: 'Manrope', sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(231, 105, 46, 0.18), transparent 32%),
          radial-gradient(circle at top right, rgba(31, 122, 114, 0.16), transparent 28%),
          linear-gradient(180deg, #efe5d3 0%, #f5efe3 42%, #f7f3ea 100%);
        min-height: 100vh;
        line-height: 1.7;
        overflow-x: hidden;
        word-break: keep-all;
      }

      html[lang='ko'] body {
        font-family: 'Noto Sans KR', 'Manrope', sans-serif;
        line-height: 1.82;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(31, 36, 48, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(31, 36, 48, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.8), transparent 92%);
        pointer-events: none;
        z-index: 0;
      }

      .ambient {
        position: fixed;
        border-radius: 999px;
        filter: blur(28px);
        opacity: 0.45;
        pointer-events: none;
        z-index: 0;
        animation: drift 16s ease-in-out infinite alternate;
      }

      .ambient-one {
        width: 320px;
        height: 320px;
        top: 120px;
        right: -60px;
        background: rgba(231, 105, 46, 0.16);
      }

      .ambient-two {
        width: 240px;
        height: 240px;
        bottom: 80px;
        left: -40px;
        background: rgba(31, 122, 114, 0.14);
        animation-duration: 18s;
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(var(--page-width), calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 72px;
      }

      .section-shell {
        position: relative;
        margin-bottom: 24px;
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        overflow: hidden;
      }

      .section-shell::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.32);
        pointer-events: none;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.95fr);
        gap: 28px;
        padding-top: 36px;
      }

      .hero-copy,
      .hero-panel {
        position: relative;
        z-index: 1;
      }

      .hero-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .eyebrow,
      .section-kicker,
      .mini-label,
      .timeline-period,
      .signal-meta {
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .eyebrow,
      .section-kicker {
        color: var(--accent-deep);
        font-size: 0.82rem;
      }

      .lang-switcher {
        display: inline-flex;
        padding: 5px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.66);
        box-shadow: var(--shadow-soft);
      }

      .lang-btn {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        padding: 9px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          background 180ms ease,
          color 180ms ease,
          transform 180ms ease;
      }

      .lang-btn.is-active {
        background: rgba(231, 105, 46, 0.14);
        color: var(--accent-deep);
      }

      .lang-btn:hover,
      .lang-btn:focus-visible {
        transform: translateY(-1px);
        outline: none;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        font-family: 'Space Grotesk', sans-serif;
        letter-spacing: -0.03em;
        word-break: keep-all;
      }

      html[lang='ko'] h1,
      html[lang='ko'] h2,
      html[lang='ko'] h3 {
        font-family: 'Noto Sans KR', 'Manrope', sans-serif;
        letter-spacing: -0.04em;
      }

      h1 {
        font-size: clamp(3rem, 6vw, 5.1rem);
        line-height: 0.92;
        margin-top: 16px;
      }

      .hero-role {
        margin: 18px 0 16px;
        font-size: 1.18rem;
        color: var(--accent-alt);
        font-weight: 700;
        word-break: keep-all;
      }

      .hero-summary {
        max-width: 62ch;
        margin: 0;
        font-size: 1.05rem;
        color: var(--muted);
        word-break: keep-all;
      }

      html[lang='ko'] .hero-summary,
      html[lang='ko'] .section-description,
      html[lang='ko'] .card-copy,
      html[lang='ko'] .timeline-copy,
      html[lang='ko'] .timeline-impact,
      html[lang='ko'] .stat-label,
      html[lang='ko'] .closing-quote,
      html[lang='ko'] .closing-note {
        line-height: 1.82;
      }

      .link-row,
      .chip-row,
      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .link-row {
        margin-top: 24px;
      }

      .link-pill,
      .chip,
      .tag,
      .stat-card,
      .story-card,
      .signal-card,
      .tool-card,
      .principle-card,
      .education-card {
        border: 1px solid var(--line);
        background: var(--surface-strong);
        box-shadow: var(--shadow-soft);
      }

      .link-pill,
      .chip,
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        text-decoration: none;
        line-height: 1.35;
      }

      .link-pill {
        color: var(--ink);
        font-weight: 700;
        overflow-wrap: anywhere;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease;
      }

      .link-pill::before {
        content: '↗';
        color: var(--accent);
        font-size: 0.95rem;
      }

      .link-pill:hover,
      .link-pill:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(231, 105, 46, 0.4);
        background: #fffdf8;
        outline: none;
      }

      .chip-row {
        margin-top: 18px;
      }

      .chip,
      .tag {
        color: var(--muted);
        font-size: 0.93rem;
        overflow-wrap: anywhere;
      }

      .chip {
        background: rgba(255, 255, 255, 0.54);
      }

      .hero-panel {
        padding: 22px;
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 248, 237, 0.95)),
          radial-gradient(circle at top right, rgba(231, 105, 46, 0.12), transparent 48%);
        border: 1px solid rgba(31, 36, 48, 0.1);
      }

      .mini-label {
        display: inline-flex;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-deep);
        font-size: 0.72rem;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .stat-card {
        padding: 18px;
        border-radius: var(--radius-md);
      }

      .stat-value {
        display: block;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 2rem;
        line-height: 1;
      }

      .stat-label {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.92rem;
        word-break: keep-all;
      }

      .focus-note {
        margin-top: 18px;
        padding: 18px;
        border-radius: var(--radius-md);
        background: rgba(31, 122, 114, 0.08);
        border: 1px solid rgba(31, 122, 114, 0.16);
      }

      .focus-note p {
        margin: 0 0 10px;
        font-weight: 800;
      }

      .compact-list,
      .timeline-points,
      .signal-list,
      .tool-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .compact-list li,
      .timeline-points li,
      .signal-list li,
      .tool-list li {
        position: relative;
        padding-left: 18px;
        color: var(--muted);
      }

      .compact-list li + li,
      .timeline-points li + li,
      .signal-list li + li,
      .tool-list li + li {
        margin-top: 8px;
      }

      .compact-list li::before,
      .timeline-points li::before,
      .signal-list li::before,
      .tool-list li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0.72em;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      }

      .section-heading {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 24px;
      }

      .section-heading h2 {
        font-size: clamp(1.9rem, 3vw, 2.8rem);
      }

      .section-description {
        max-width: 64ch;
        margin: 0;
        color: var(--muted);
        word-break: keep-all;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .story-card,
      .signal-card,
      .tool-card,
      .principle-card,
      .education-card {
        padding: 24px;
        border-radius: var(--radius-lg);
      }

      .story-card h3,
      .signal-card h3,
      .tool-card h3,
      .principle-card h3,
      .education-card h3,
      .timeline-content h3 {
        font-size: 1.3rem;
      }

      .card-copy,
      .timeline-copy {
        margin: 12px 0 0;
        color: var(--muted);
        word-break: keep-all;
      }

      .tag-row {
        margin-top: 18px;
      }

      .tag {
        font-size: 0.84rem;
        background: rgba(255, 255, 255, 0.72);
      }

      .tag.highlight {
        color: var(--accent-deep);
        border-color: rgba(231, 105, 46, 0.2);
        background: var(--accent-soft);
      }

      .timeline {
        position: relative;
        --timeline-axis: 15px;
        --timeline-stroke: 2px;
        --timeline-gutter: 42px;
        --timeline-marker-size: 14px;
        --timeline-marker-ring: 4px;
      }

      .timeline::before {
        content: '';
        position: absolute;
        left: calc(var(--timeline-axis) - (var(--timeline-stroke) / 2));
        top: 14px;
        bottom: 14px;
        width: var(--timeline-stroke);
        background: linear-gradient(180deg, rgba(231, 105, 46, 0.55), rgba(31, 122, 114, 0.45));
      }

      .timeline-item {
        position: relative;
        display: grid;
        grid-template-columns: 160px minmax(0, 1fr);
        gap: 20px;
        padding: 6px 0 24px var(--timeline-gutter);
      }

      .timeline-item:last-child {
        padding-bottom: 0;
      }

      .timeline-item::before {
        content: '';
        position: absolute;
        left: calc(
          var(--timeline-axis) - ((var(--timeline-marker-size) + (var(--timeline-marker-ring) * 2)) / 2)
        );
        top: 14px;
        width: var(--timeline-marker-size);
        height: var(--timeline-marker-size);
        border-radius: 50%;
        background: var(--paper-strong);
        border: var(--timeline-marker-ring) solid var(--accent);
        box-shadow: 0 0 0 6px rgba(231, 105, 46, 0.12);
      }

      .timeline-period {
        color: var(--accent-deep);
        font-size: 0.78rem;
        padding-top: 6px;
      }

      .timeline-company {
        margin-top: 6px;
        color: var(--accent-alt);
        font-weight: 800;
        word-break: keep-all;
      }

      .timeline-impact {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--line);
        color: var(--ink);
      }

      .signal-grid,
      .tool-grid,
      .principle-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .signal-meta {
        display: inline-flex;
        margin-top: 14px;
        color: var(--accent-deep);
        font-size: 0.74rem;
      }

      .tool-list strong {
        color: var(--ink);
      }

      .education-card {
        display: grid;
        gap: 14px;
      }

      .education-line {
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .education-line:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .education-line strong {
        display: block;
        font-size: 1rem;
      }

      .education-line span {
        color: var(--muted);
      }

      .principle-card {
        min-height: 100%;
      }

      .principle-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        margin-bottom: 14px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent-deep);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1rem;
        font-weight: 700;
      }

      .closing {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
        gap: 18px;
        align-items: start;
      }

      .closing-quote {
        font-size: 1.18rem;
        color: var(--ink);
        font-weight: 700;
        line-height: 1.6;
      }

      .closing-note {
        margin: 14px 0 0;
        color: var(--muted);
      }

      .callout {
        padding: 22px;
        border-radius: var(--radius-lg);
        background: linear-gradient(180deg, rgba(231, 105, 46, 0.1), rgba(31, 122, 114, 0.08));
        border: 1px solid rgba(31, 36, 48, 0.12);
      }

      .callout h3 {
        margin-bottom: 10px;
      }

      .work-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 18px;
      }

      .work-card {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--surface-strong);
        box-shadow: var(--shadow-soft);
        overflow: hidden;
        transition:
          transform 200ms ease,
          box-shadow 200ms ease;
      }

      .work-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow);
      }

      .work-media {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        background: #efe7d8;
        border-bottom: 1px solid var(--line);
      }

      .work-media-link {
        display: block;
        overflow: hidden;
      }

      .work-media-link .work-media {
        transition: transform 240ms ease;
      }

      .work-media-link:hover .work-media,
      .work-media-link:focus-visible .work-media {
        transform: scale(1.04);
      }

      .work-media-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .work-media--code {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 1.15rem;
        letter-spacing: 0.08em;
        color: var(--accent-deep);
        background:
          linear-gradient(135deg, rgba(231, 105, 46, 0.14), rgba(31, 122, 114, 0.14)),
          repeating-linear-gradient(45deg, rgba(31, 36, 48, 0.03) 0 10px, transparent 10px 20px);
      }

      .work-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 20px;
      }

      .work-meta {
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.72rem;
        color: var(--accent-deep);
      }

      .work-card h3 {
        margin-top: 8px;
        font-size: 1.18rem;
      }

      .work-summary {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.96rem;
        word-break: keep-all;
      }

      html[lang='ko'] .work-summary,
      html[lang='ko'] .work-role {
        line-height: 1.78;
      }

      .work-role {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: var(--radius-md);
        background: rgba(31, 122, 114, 0.08);
        border: 1px solid rgba(31, 122, 114, 0.16);
        color: var(--ink);
        font-size: 0.9rem;
        word-break: keep-all;
      }

      .work-role strong {
        color: var(--accent-alt);
      }

      .work-spacer {
        flex: 1;
      }

      .work-card .tag-row {
        margin-top: 14px;
      }

      .work-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .work-links .link-pill {
        padding: 8px 12px;
        font-size: 0.86rem;
      }


      @keyframes drift {
        from {
          transform: translate3d(0, 0, 0) scale(1);
        }

        to {
          transform: translate3d(12px, -18px, 0) scale(1.08);
        }
      }

      @media (max-width: 980px) {
        .hero,
        .closing,
        .timeline-item,
        .signal-grid,
        .tool-grid,
        .principle-grid,
        .card-grid {
          grid-template-columns: 1fr;
        }

        .page {
          width: min(var(--page-width), calc(100% - 20px));
          padding-top: 36px;
        }
      }

      @media (max-width: 640px) {
        .section-shell {
          padding: 24px 20px;
          border-radius: 26px;
        }

        .hero-top {
          flex-direction: column;
          align-items: stretch;
        }

        .lang-switcher {
          align-self: flex-start;
        }

        h1 {
          font-size: 2.8rem;
        }

        .metric-grid {
          grid-template-columns: 1fr;
        }

        .link-row,
        .chip-row,
        .tag-row {
          gap: 10px;
        }

        .link-pill,
        .chip,
        .tag {
          width: 100%;
          justify-content: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .ambient {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="page">
      <section class="section-shell hero" data-reveal>
        <div class="hero-copy">
          <div class="hero-top">
            <div class="eyebrow" id="philosophy"></div>
            <div class="lang-switcher" role="group" aria-label="Language switch">
              <button class="lang-btn" type="button" data-lang-target="en">EN</button>
              <button class="lang-btn" type="button" data-lang-target="ko">KO</button>
            </div>
          </div>
          <h1 id="name"></h1>
          <p class="hero-role" id="hero-role"></p>
          <p class="hero-summary" id="hero-summary"></p>
          <div class="link-row" id="link-row"></div>
          <div class="chip-row" id="chip-row"></div>
        </div>

        <aside class="hero-panel">
          <span class="mini-label" id="signals-label"></span>
          <div class="metric-grid" id="metric-grid"></div>
          <div class="focus-note">
            <p id="focus-title"></p>
            <ul class="compact-list" id="focus-list"></ul>
          </div>
        </aside>
      </section>

      <section class="section-shell" data-reveal>
        <div class="section-heading">
          <div class="section-kicker" id="capability-kicker"></div>
          <h2 id="capability-title"></h2>

              '이 프레임은 블로그, 연구, 제품 작업 전반에서 일관되게 유지해 온 원칙입니다. 좋은 AI 제품은 더 큰 모델만으로 나오지 않고, 올바른 질문과 맥락 회수, 그리고 실제 사용 가능한 형태로의 수렴에서 나옵니다.',
            principles: [
              {
                title: 'Curiosity',
                copy:
                  '저는 모델이 무엇을 할 수 있는지보다 사용자가 어디에서 막히는지를 먼저 봅니다. 그 전환이 모호한 기술 아이디어를 제품 질문으로 바꿔 줍니다.'
              },
              {
                title: 'Retrieve',
                copy:
                  '논문, 벤치마크, 로그, 기존 workflow, tool interface를 함께 봅니다. 이 단계에서 왜 최근 agent system이 tools, context, evaluation, guardrails 중심으로 이동하는지가 분명해집니다.'
              },
              {
                title: 'Innovation',
                copy:
                  '결국에는 운영 가능한 형태로 수렴시키고 싶습니다. usable interface, realistic workflow, hybrid deployment path, 팀이 계속 개선할 수 있는 구조를 만드는 쪽으로 마무리합니다.'
              }
            ],
            educationTitle: '학력',
            education: [
              { title: '홍익대학교 게임공학 박사과정', date: 'Sep 2024 - Present' },
              { title: '홍익대학교 게임공학 석사', date: 'Aug 2014 - Aug 2016' },
              { title: '홍익대학교 게임공학 학사', date: 'Mar 2007 - Feb 2014' }
            ]
          },
          next: {
            kicker: '다음 방향',
            title: '앞으로 무엇을 더 잘 만들 수 있는지로 평가받고 싶습니다',
            quote:
              '저는 연구를 이해하는 사람에 머물기보다, 연구를 도구, 평가, 인터페이스 설계, 운영 가능한 전달 구조로 연결하는 AI product engineer로 계속 성장하고 있습니다.',
            note:
              '다음 단계에서는 멀티모달 QA, agent UX, eval-driven delivery, open protocol 기반 tool interoperability, wellness/robotics 주변의 AI-native 경험을 더 깊게 제품화하고 싶습니다. AI가 복잡한 workflow를 안전하고 명확하게 보조해야 하는 팀에서 가장 큰 가치를 냅니다.',
            calloutTitle: '한 줄 요약',
            calloutCopy:
              '게임 AI production 경험을 기반으로, agentic, multimodal, product-oriented AI systems를 실제 제품으로 연결하고 있는 연구 기반 빌더입니다.',
            calloutTags: ['제품 지향', '연구 기반', '학습 지속', '빌더']
          }
        }
      };

      const setHtml = (id, value) => {
        document.getElementById(id).innerHTML = value;
      };

      const setText = (id, value) => {
        document.getElementById(id).textContent = value;
      };

      const renderTags = tags =>
        tags
          .map((tag, index) => `<span class="tag ${index === 0 ? 'highlight' : ''}">${tag}</span>`)
          .join('');

      const renderListItems = items => items.map(item => `<li>${item}</li>`).join('');

      const renderMetricCards = stats =>
        stats
          .map(
            stat => `
              <article class="stat-card">
                <span class="stat-value">${stat.value}</span>
                <div class="stat-label">${stat.label}</div>
              </article>
            `
          )
          .join('');

      const renderStoryCards = cards =>
        cards
          .map(
            card => `
              <article class="story-card">
                <h3>${card.title}</h3>
                <p class="card-copy">${card.copy}</p>
                <div class="tag-row">${renderTags(card.tags)}</div>
              </article>
            `
          )
          .join('');

      const renderTimeline = items =>
        items
          .map(
            item => `
              <article class="timeline-item">
                <div>
                  <div class="timeline-period">${item.period}</div>
                  <div class="timeline-company">${item.company}</div>
                </div>
                <div class="timeline-content">
                  <h3>${item.title}</h3>
                  <p class="timeline-copy">${item.copy}</p>
                  <ul class="timeline-points">${renderListItems(item.bullets)}</ul>
                  <div class="timeline-impact">${item.impact}</div>
                </div>
              </article>
            `
          )
          .join('');

      const renderSignalCards = cards =>
        cards
          .map(
            card => `
              <article class="signal-card">
                <h3>${card.title}</h3>
                <ul class="signal-list">${renderListItems(card.items)}</ul>
                <span class="signal-meta">${card.meta}</span>
              </article>
            `
          )
          .join('');

      const renderToolCards = cards =>
        cards
          .map(
            card => `
              <article class="tool-card">
                <h3>${card.title}</h3>
                <ul class="tool-list">${renderListItems(card.items)}</ul>
              </article>
            `
          )
          .join('');

      const renderPrinciples = (principles, educationTitle, education) => {
        const principleCards = principles
          .map(
            (item, index) => `
              <article class="principle-card">
                <span class="principle-number">${index + 1}</span>
                <h3>${item.title}</h3>
                <p class="card-copy">${item.copy}</p>
              </article>
            `
          )
          .join('');

        const educationCard = `
          <article class="education-card">
            <h3>${educationTitle}</h3>
            ${education
              .map(
                item => `
                  <div class="education-line">
                    <strong>${item.title}</strong>
                    <span>${item.date}</span>
                  </div>
                `
              )
              .join('')}
          </article>
        `;

        return principleCards + educationCard;
      };

      const renderLinks = () =>
        links.map(link => `<a class="link-pill" href="${link.href}">${link.label}</a>`).join('');

      const renderWorkProjects = (projects, roleLabel) =>

        projects
          .map(project => {
            const projectLink = project.links && project.links[0] && project.links[0].href;
            const mediaInner = project.image
              ? `<img class="work-media" src="${project.image}" alt="${project.alt}" loading="lazy">`
              : `<div class="work-media work-media--code" aria-hidden="true">${project.codeLabel || project.title}</div>`;
            const media = projectLink
              ? `<a class="work-media-link" href="${projectLink}" target="_blank" rel="noopener">${mediaInner}</a>`
              : mediaInner;
            const links = (project.links || [])
              .map(link => `<a class="link-pill" href="${link.href}" target="_blank" rel="noopener">${link.label}</a>`)
              .join('');
            return `
              <article class="work-card">
                ${media}
                <div class="work-body">
                  <span class="work-meta">${project.meta}</span>
                  <h3>${project.title}</h3>
                  <p class="work-role"><strong>${roleLabel}</strong> ${project.role}</p>
                  <div class="work-spacer"></div>
                  <div class="tag-row">${renderTags(project.tags)}</div>
                  ${links ? `<div class="work-links">${links}</div>` : ''}
                </div>
              </article>
            `;
          })
          .join('');


      function applyLanguage(lang) {
        const data = content[lang] || content.en;
        document.documentElement.lang = lang;
        document.title = data.title;
        document.querySelector('meta[name="description"]').setAttribute('content', data.description);

        setText('philosophy', data.philosophy);
        setText('name', data.name);
        setText('hero-role', data.role);
        setText('hero-summary', data.summary);
        setHtml('link-row', renderLinks());
        setHtml('chip-row', data.chips.map(chip => `<span class="chip">${chip}</span>`).join(''));
        setText('signals-label', data.signalsLabel);
        setHtml('metric-grid', renderMetricCards(data.stats));
        setText('focus-title', data.focusTitle);
        setHtml('focus-list', renderListItems(data.focusList));

        setText('capability-kicker', data.capability.kicker);
        setText('capability-title', data.capability.title);
        setText('capability-description', data.capability.description);
        setHtml('capability-grid', renderStoryCards(data.capability.cards));

        setText('career-kicker', data.career.kicker);
        setText('career-title', data.career.title);
        setText('career-description', data.career.description);
        setHtml('career-timeline', renderTimeline(data.career.items));

        setText('work-kicker', data.work.kicker);
        setText('work-title', data.work.title);
        setText('work-description', data.work.description);
        setHtml('work-grid', renderWorkProjects(data.work.projects, data.work.roleLabel));


        setText('signals-kicker', data.signals.kicker);
        setText('signals-title', data.signals.title);
        setHtml('signals-grid', renderSignalCards(data.signals.cards));

        setText('toolbox-kicker', data.toolbox.kicker);
        setText('toolbox-title', data.toolbox.title);
        setHtml('toolbox-grid', renderToolCards(data.toolbox.cards));

        setText('working-kicker', data.working.kicker);
        setText('working-title', data.working.title);
        setText('working-description', data.working.description);
        setHtml(
          'principle-grid',
          renderPrinciples(data.working.principles, data.working.educationTitle, data.working.education)
        );

        setText('next-kicker', data.next.kicker);
        setText('next-title', data.next.title);
        setText('next-quote', data.next.quote);
        setText('next-note', data.next.note);
        setText('callout-title', data.next.calloutTitle);
        setText('callout-copy', data.next.calloutCopy);
        setHtml('callout-tags', renderTags(data.next.calloutTags));

        document.querySelectorAll('.lang-btn').forEach(button => {
          const active = button.dataset.langTarget === lang;
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-pressed', String(active));
        });

        localStorage.setItem('resume-lang', lang);
        const url = new URL(window.location.href);
        if (lang === 'en') {
          url.searchParams.delete('lang');
        } else {
          url.searchParams.set('lang', lang);
        }
        history.replaceState({}, '', url);
      }

      const preferredLang =
        new URLSearchParams(window.location.search).get('lang') ||
        localStorage.getItem('resume-lang') ||
        'en';

      document.querySelectorAll('.lang-btn').forEach(button => {
        button.addEventListener('click', () => applyLanguage(button.dataset.langTarget));
      });

      applyLanguage(preferredLang === 'ko' ? 'ko' : 'en');

    </script>
  </body>
</html>
