---
layout: page
# All the Tags of posts.
---

<!--
  The hub links exactly the tag archives that were built. Both sides read
  site.data.linkable_tags / site.data.tag_visible_counts, which
  _plugins/archive_quality_policy.rb writes from the pages it kept, so the hub
  cannot advertise a tag page that does not exist.
-->
<div id="tags" class="d-flex flex-wrap mx-xl-2">
  {% for t in site.data.linkable_tags %}
    <div>
      <a class="tag" href="{{ t | slugify | url_encode | prepend: '/tags/' | append: '/' | relative_url }}">
        {{ t -}}
        <span class="text-muted">{{ site.data.tag_visible_counts[t] }}</span>
      </a>
    </div>
  {% endfor %}
</div>
