<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1140 720" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="jeoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#4338CA"/></linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1" />
    </marker>
    <marker id="arrowOpen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11" fill="none" stroke="#94A3B8" stroke-width="1.6" />
    </marker>
  </defs>

  <rect width="1140" height="720" fill="url(#bgGradient)" rx="16" />

  <text x="570" y="46" font-size="27" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">How a Skill Execution Works</text>
  <text x="570" y="74" font-size="14" fill="#94A3B8" text-anchor="middle">Routing-first: pick the lightest workable path, route out honestly</text>

  <!-- lifelines -->
  <line x1="160" y1="166" x2="160" y2="690" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,5" opacity="0.55"/>
  <line x1="440" y1="166" x2="440" y2="690" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4,5" opacity="0.55"/>
  <line x1="740" y1="166" x2="740" y2="690" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4,5" opacity="0.55"/>
  <line x1="1010" y1="166" x2="1010" y2="690" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,5" opacity="0.55"/>

  <!-- jeo activation bar -->
  <rect x="433" y="240" width="14" height="412" rx="3" fill="#6366F1" opacity="0.28" />
  <rect x="733" y="300" width="14" height="60" rx="3" fill="#8B5CF6" opacity="0.30" />
  <rect x="1003" y="472" width="14" height="60" rx="3" fill="#10B981" opacity="0.30" />

  <!-- participant headers -->
  <g transform="translate(60,110)"><rect width="200" height="56" rx="12" fill="url(#boxGradient)" stroke="url(#userGrad)" stroke-width="2.5" filter="url(#glow)"/><text x="100" y="35" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="middle">🧑‍💻 User</text></g>
  <g transform="translate(340,110)"><rect width="200" height="56" rx="12" fill="url(#boxGradient)" stroke="url(#jeoGrad)" stroke-width="2.5" filter="url(#glow)"/><text x="100" y="35" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="middle">🤖 jeo Agent</text></g>
  <g transform="translate(640,110)"><rect width="200" height="56" rx="12" fill="url(#boxGradient)" stroke="url(#skillGrad)" stroke-width="2.5" filter="url(#glow)"/><text x="100" y="35" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="middle">🧭 SKILL Router</text></g>
  <g transform="translate(910,110)"><rect width="200" height="56" rx="12" fill="url(#boxGradient)" stroke="url(#toolGrad)" stroke-width="2.5" filter="url(#glow)"/><text x="100" y="35" font-size="14" font-weight="700" fill="#F1F5F9" text-anchor="middle">💻 Shell / File System</text></g>

  <!-- m1 User -> jeo -->
  <text x="300" y="230" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">$scrapling "extract pricing table"</text>
  <line x1="160" y1="240" x2="431" y2="240" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- m2 jeo -> Skill -->
  <text x="592" y="292" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">match keyword → load SKILL.md</text>
  <line x1="447" y1="302" x2="731" y2="302" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- m3 Skill to jeo (return) -->
  <text x="592" y="350" font-size="13" fill="#A78BFA" text-anchor="middle">tools, patterns, route-outs</text>
  <line x1="733" y1="360" x2="449" y2="360" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- note over jeo,Skill -->
  <rect x="455" y="386" width="270" height="50" rx="8" fill="#1e1b4b" stroke="#8B5CF6" stroke-width="1.5" opacity="0.95"/>
  <text x="590" y="408" font-size="12.5" font-weight="600" fill="#C4B5FD" text-anchor="middle">skill constrains the agent</text>
  <text x="590" y="426" font-size="12.5" fill="#A78BFA" text-anchor="middle">no hallucinated APIs</text>

  <!-- m5 jeo -> Tool -->
  <text x="727" y="464" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">read · search · bash (guided)</text>
  <line x1="447" y1="474" x2="1001" y2="474" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- m6 Tool to jeo (return) -->
  <text x="727" y="522" font-size="13" fill="#6EE7B7" text-anchor="middle">results</text>
  <line x1="1003" y1="532" x2="449" y2="532" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- m7 jeo self -->
  <path d="M 447 568 H 560 V 596 H 449" fill="none" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="562" font-size="13" font-weight="600" fill="#A5B4FC">post-edit hooks verify</text>

  <!-- m8 jeo to User (return) -->
  <text x="300" y="642" font-size="13" font-weight="600" fill="#34D399" text-anchor="middle">done — honest summary</text>
  <line x1="431" y1="652" x2="162" y2="652" stroke="#34D399" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
</svg>
