<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 820 760" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F472B6"/><stop offset="100%" stop-color="#BE185D"/></linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#F472B6"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F472B6" />
    </marker>
  </defs>

  <rect width="820" height="760" fill="url(#bgGradient)" rx="16" />

  <text x="410" y="48" font-size="27" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">The Five Harness Principles</text>
  <text x="410" y="76" font-size="14" fill="#94A3B8" text-anchor="middle">A self-correcting, spec-first loop baked into the jeo runtime</text>

  <!-- connectors between cards -->
  <path d="M 360 198 L 360 215" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 360 304 L 360 321" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 360 410 L 360 427" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 360 516 L 360 533" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- return loop -->
  <path d="M 550 578 H 680 V 154 H 552" fill="none" stroke="url(#loopGrad)" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowPink)" filter="url(#glow)" opacity="0.9" />
  <text x="700" y="366" font-size="13" font-weight="600" fill="#F472B6" text-anchor="middle" transform="rotate(90 700 366)">↻ new task cycle</text>

  <!-- Card 1 -->
  <g transform="translate(170,110)">
    <rect width="380" height="88" rx="12" fill="url(#boxGradient)" stroke="url(#g1)" stroke-width="2" filter="url(#glow)" />
    <rect x="0" y="0" width="6" height="88" rx="3" fill="#3B82F6" />
    <circle cx="46" cy="44" r="21" fill="url(#g1)" filter="url(#glow)" />
    <text x="46" y="51" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="84" y="40" font-size="17" font-weight="700" fill="#F1F5F9">🎯 Spec-First Workflow</text>
    <text x="84" y="63" font-size="13" fill="#93C5FD">deep-interview gates intent before code</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(170,216)">
    <rect width="380" height="88" rx="12" fill="url(#boxGradient)" stroke="url(#g2)" stroke-width="2" />
    <rect x="0" y="0" width="6" height="88" rx="3" fill="#8B5CF6" />
    <circle cx="46" cy="44" r="21" fill="url(#g2)" filter="url(#glow)" />
    <text x="46" y="51" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="84" y="40" font-size="17" font-weight="700" fill="#F1F5F9">📋 Reviewed Plans</text>
    <text x="84" y="63" font-size="13" fill="#C4B5FD">ralplan consensus before execution</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(170,322)">
    <rect width="380" height="88" rx="12" fill="url(#boxGradient)" stroke="url(#g3)" stroke-width="2" />
    <rect x="0" y="0" width="6" height="88" rx="3" fill="#F59E0B" />
    <circle cx="46" cy="44" r="21" fill="url(#g3)" filter="url(#glow)" />
    <text x="46" y="51" font-size="20" font-weight="700" fill="#1E293B" text-anchor="middle">3</text>
    <text x="84" y="40" font-size="17" font-weight="700" fill="#F1F5F9">🔒 Gated Execution</text>
    <text x="84" y="63" font-size="13" fill="#FCD34D">approval required before changes land</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(170,428)">
    <rect width="380" height="88" rx="12" fill="url(#boxGradient)" stroke="url(#g4)" stroke-width="2" />
    <rect x="0" y="0" width="6" height="88" rx="3" fill="#10B981" />
    <circle cx="46" cy="44" r="21" fill="url(#g4)" filter="url(#glow)" />
    <text x="46" y="51" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="84" y="40" font-size="17" font-weight="700" fill="#F1F5F9">✅ Honest Verification</text>
    <text x="84" y="63" font-size="13" fill="#6EE7B7">ultragoal reports what actually ran</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(170,534)">
    <rect width="380" height="88" rx="12" fill="url(#boxGradient)" stroke="url(#g5)" stroke-width="2" />
    <rect x="0" y="0" width="6" height="88" rx="3" fill="#F472B6" />
    <circle cx="46" cy="44" r="21" fill="url(#g5)" filter="url(#glow)" />
    <text x="46" y="51" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="84" y="40" font-size="17" font-weight="700" fill="#F1F5F9">🔄 Self-Correcting Loop</text>
    <text x="84" y="63" font-size="13" fill="#F9A8D4">post-edit hooks re-verify every change</text>
  </g>
</svg>
