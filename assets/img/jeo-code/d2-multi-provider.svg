<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1140 620" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="jeoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#4338CA"/></linearGradient>
    <linearGradient id="pa" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="pb" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="pc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="pd" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
    <linearGradient id="pe" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2DD4BF"/><stop offset="100%" stop-color="#0D9488"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
    </marker>
    <marker id="arrowI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818CF8" />
    </marker>
  </defs>

  <rect width="1140" height="620" fill="url(#bgGradient)" rx="16" />

  <text x="570" y="46" font-size="27" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Multi-Provider, One Loop</text>
  <text x="570" y="74" font-size="14" fill="#94A3B8" text-anchor="middle">Every major LLM flows through one uniform JSON tool loop</text>

  <!-- column labels -->
  <text x="130" y="140" font-size="12" font-weight="600" fill="#60A5FA" text-anchor="middle" letter-spacing="1">AGENT</text>
  <text x="390" y="140" font-size="12" font-weight="600" fill="#60A5FA" text-anchor="middle" letter-spacing="1">PROVIDERS</text>
  <text x="685" y="140" font-size="12" font-weight="600" fill="#818CF8" text-anchor="middle" letter-spacing="1">TOOL LOOP</text>
  <text x="980" y="140" font-size="12" font-weight="600" fill="#60A5FA" text-anchor="middle" letter-spacing="1">ACTIONS</text>

  <!-- arrows: jeo -> providers -->
  <path d="M 210 358 C 245 210, 245 210, 270 210" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 210 358 C 245 284, 245 284, 270 284" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 210 358 L 270 358" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 210 358 C 245 432, 245 432, 270 432" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 210 358 C 245 506, 245 506, 270 506" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- arrows: providers -> hub -->
  <path d="M 510 210 C 545 358, 545 358, 580 358" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowI)" opacity="0.8"/>
  <path d="M 510 284 C 545 358, 545 358, 580 358" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowI)" opacity="0.8"/>
  <path d="M 510 358 L 580 358" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowI)"/>
  <path d="M 510 432 C 545 358, 545 358, 580 358" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowI)" opacity="0.8"/>
  <path d="M 510 506 C 545 358, 545 358, 580 358" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowI)" opacity="0.8"/>

  <!-- arrows: hub -> actions -->
  <path d="M 790 358 C 825 244, 825 244, 860 244" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 790 358 C 825 320, 825 320, 860 320" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 790 358 C 825 396, 825 396, 860 396" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 790 358 C 825 472, 825 472, 860 472" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- jeo agent -->
  <g transform="translate(50,318)">
    <rect width="160" height="80" rx="14" fill="url(#boxGradient)" stroke="url(#jeoGrad)" stroke-width="3" filter="url(#glow)" />
    <text x="80" y="40" font-size="22" text-anchor="middle">🤖</text>
    <text x="80" y="64" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="middle">jeo agent</text>
  </g>

  <!-- providers -->
  <g transform="translate(270,180)"><rect width="240" height="60" rx="10" fill="url(#boxGradient)" stroke="url(#pa)" stroke-width="2"/><rect width="6" height="60" rx="3" fill="#F59E0B"/><text x="124" y="27" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="middle">Anthropic Claude</text><text x="124" y="47" font-size="12" fill="#FCD34D" text-anchor="middle">Sonnet · Opus · Haiku</text></g>
  <g transform="translate(270,254)"><rect width="240" height="60" rx="10" fill="url(#boxGradient)" stroke="url(#pb)" stroke-width="2"/><rect width="6" height="60" rx="3" fill="#10B981"/><text x="124" y="27" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="middle">OpenAI + Codex</text><text x="124" y="47" font-size="12" fill="#6EE7B7" text-anchor="middle">GPT · o-series · Codex</text></g>
  <g transform="translate(270,328)"><rect width="240" height="60" rx="10" fill="url(#boxGradient)" stroke="url(#pc)" stroke-width="2"/><rect width="6" height="60" rx="3" fill="#8B5CF6"/><text x="124" y="27" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="middle">Antigravity</text><text x="124" y="47" font-size="12" fill="#C4B5FD" text-anchor="middle">agy cross-vendor harness</text></g>
  <g transform="translate(270,402)"><rect width="240" height="60" rx="10" fill="url(#boxGradient)" stroke="url(#pd)" stroke-width="2"/><rect width="6" height="60" rx="3" fill="#38BDF8"/><text x="124" y="27" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="middle">xAI Grok · Kimi</text><text x="124" y="47" font-size="12" fill="#7DD3FC" text-anchor="middle">frontier + open weights</text></g>
  <g transform="translate(270,476)"><rect width="240" height="60" rx="10" fill="url(#boxGradient)" stroke="url(#pe)" stroke-width="2"/><rect width="6" height="60" rx="3" fill="#2DD4BF"/><text x="124" y="27" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="middle">Ollama · LM Studio</text><text x="124" y="47" font-size="12" fill="#5EEAD4" text-anchor="middle">local, offline models</text></g>

  <!-- hub -->
  <g transform="translate(580,298)">
    <rect width="210" height="120" rx="14" fill="url(#boxGradient)" stroke="url(#hubGrad)" stroke-width="3" filter="url(#glow)" />
    <text x="105" y="42" font-size="26" text-anchor="middle">🛠️</text>
    <text x="105" y="72" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="middle">Uniform JSON</text>
    <text x="105" y="94" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="middle">Tool Loop</text>
  </g>

  <!-- actions -->
  <g transform="translate(860,214)"><rect width="240" height="60" rx="10" fill="url(#boxGradient)" stroke="#3B82F6" stroke-width="2"/><rect width="6" height="60" rx="3" fill="#3B82F6"/><text x="124" y="36" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle">✏️  Edit Files</text></g>
  <g transform="translate(860,290)"><rect width="240" height="60" rx="10" fill="url(#boxGradient)" stroke="#F59E0B" stroke-width="2"/><rect width="6" height="60" rx="3" fill="#F59E0B"/><text x="124" y="36" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle">⚙️  Run Commands</text></g>
  <g transform="translate(860,366)"><rect width="240" height="60" rx="10" fill="url(#boxGradient)" stroke="#8B5CF6" stroke-width="2"/><rect width="6" height="60" rx="3" fill="#8B5CF6"/><text x="124" y="36" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle">📖  Read Codebase</text></g>
  <g transform="translate(860,442)"><rect width="240" height="60" rx="10" fill="url(#boxGradient)" stroke="#10B981" stroke-width="2"/><rect width="6" height="60" rx="3" fill="#10B981"/><text x="124" y="36" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle">✅  Verify Results</text></g>
</svg>
