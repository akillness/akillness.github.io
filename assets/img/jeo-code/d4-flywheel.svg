<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1140 700" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="youGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="jeoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#4338CA"/></linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399" />
    </marker>
  </defs>

  <rect width="1140" height="700" fill="url(#bgGradient)" rx="16" />

  <text x="570" y="46" font-size="27" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">The Builder's Flywheel</text>
  <text x="570" y="74" font-size="14" fill="#94A3B8" text-anchor="middle">You, the jeo engine, and the skills layer in one continuous loop</text>

  <!-- lane panels -->
  <rect x="60" y="120" width="300" height="500" rx="14" fill="none" stroke="url(#youGrad)" stroke-width="2" stroke-dasharray="7,5" />
  <rect x="78" y="106" width="190" height="30" rx="6" fill="#0F172A" />
  <text x="92" y="127" font-size="16" font-weight="700" fill="#60A5FA">👨‍💻 You — the Builder</text>

  <rect x="420" y="120" width="300" height="500" rx="14" fill="none" stroke="url(#jeoGrad)" stroke-width="2" stroke-dasharray="7,5" />
  <rect x="438" y="106" width="150" height="30" rx="6" fill="#0F172A" />
  <text x="452" y="127" font-size="16" font-weight="700" fill="#818CF8">🤖 jeo Engine</text>

  <rect x="780" y="120" width="300" height="500" rx="14" fill="none" stroke="url(#skillGrad)" stroke-width="2" stroke-dasharray="7,5" />
  <rect x="798" y="106" width="200" height="30" rx="6" fill="#0F172A" />
  <text x="812" y="127" font-size="16" font-weight="700" fill="#34D399">📦 jeo-skills Layer</text>

  <!-- flow arrows -->
  <path d="M 340 228 H 438" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 570 256 V 310" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 700 340 C 752 340, 748 228, 798 228" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 930 256 V 318" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 930 376 V 438" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 800 468 C 752 500, 748 480, 702 480" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 340 420 C 392 420, 388 480, 438 480" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 570 508 V 570" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 438 600 H 342" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- flywheel return -->
  <path d="M 80 600 H 32 V 228 H 78" fill="none" stroke="url(#loopGrad)" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowG)" filter="url(#glow)" opacity="0.9"/>
  <text x="50" y="414" font-size="13" font-weight="600" fill="#34D399" text-anchor="middle" transform="rotate(-90 50 414)">↻ new intent</text>

  <!-- You cards -->
  <g transform="translate(80,200)"><rect width="260" height="56" rx="10" fill="url(#boxGradient)" stroke="#3B82F6" stroke-width="2"/><rect width="6" height="56" rx="3" fill="#3B82F6"/><text x="20" y="26" font-size="15" font-weight="700" fill="#F1F5F9">Express Intent</text><text x="20" y="44" font-size="12" fill="#93C5FD">natural language</text></g>
  <g transform="translate(80,392)"><rect width="260" height="56" rx="10" fill="url(#boxGradient)" stroke="#3B82F6" stroke-width="2"/><rect width="6" height="56" rx="3" fill="#3B82F6"/><text x="20" y="26" font-size="15" font-weight="700" fill="#F1F5F9">Approve Plan</text><text x="20" y="44" font-size="12" fill="#93C5FD">jeo approve</text></g>
  <g transform="translate(80,572)"><rect width="260" height="56" rx="10" fill="url(#boxGradient)" stroke="#3B82F6" stroke-width="2"/><rect width="6" height="56" rx="3" fill="#3B82F6"/><text x="20" y="26" font-size="15" font-weight="700" fill="#F1F5F9">Verify Results</text><text x="20" y="44" font-size="12" fill="#93C5FD">ultragoal</text></g>

  <!-- Jeo cards -->
  <g transform="translate(440,200)"><rect width="260" height="56" rx="10" fill="url(#boxGradient)" stroke="#6366F1" stroke-width="2"/><rect width="6" height="56" rx="3" fill="#6366F1"/><text x="20" y="26" font-size="15" font-weight="700" fill="#F1F5F9">deep-interview</text><text x="20" y="44" font-size="12" fill="#A5B4FC">Clarify Requirements</text></g>
  <g transform="translate(440,312)"><rect width="260" height="56" rx="10" fill="url(#boxGradient)" stroke="#6366F1" stroke-width="2"/><rect width="6" height="56" rx="3" fill="#6366F1"/><text x="20" y="26" font-size="15" font-weight="700" fill="#F1F5F9">ralplan</text><text x="20" y="44" font-size="12" fill="#A5B4FC">Blueprint + Critique</text></g>
  <g transform="translate(440,452)"><rect width="260" height="56" rx="10" fill="url(#boxGradient)" stroke="#6366F1" stroke-width="2"/><rect width="6" height="56" rx="3" fill="#6366F1"/><text x="20" y="26" font-size="15" font-weight="700" fill="#F1F5F9">team</text><text x="20" y="44" font-size="12" fill="#A5B4FC">Parallel Execution</text></g>
  <g transform="translate(440,572)"><rect width="260" height="56" rx="10" fill="url(#boxGradient)" stroke="#6366F1" stroke-width="2"/><rect width="6" height="56" rx="3" fill="#6366F1"/><text x="20" y="26" font-size="15" font-weight="700" fill="#F1F5F9">Post-Edit Hooks</text><text x="20" y="44" font-size="12" fill="#A5B4FC">Self-Correct</text></g>

  <!-- Skills cards -->
  <g transform="translate(800,200)"><rect width="260" height="56" rx="10" fill="url(#boxGradient)" stroke="#10B981" stroke-width="2"/><rect width="6" height="56" rx="3" fill="#10B981"/><text x="20" y="26" font-size="15" font-weight="700" fill="#F1F5F9">Activate Right Skill</text><text x="20" y="44" font-size="12" fill="#6EE7B7">auto-routed by keyword</text></g>
  <g transform="translate(800,320)"><rect width="260" height="56" rx="10" fill="url(#boxGradient)" stroke="#10B981" stroke-width="2"/><rect width="6" height="56" rx="3" fill="#10B981"/><text x="20" y="26" font-size="15" font-weight="700" fill="#F1F5F9">Skill Constrains Agent</text><text x="20" y="44" font-size="12" fill="#6EE7B7">no hallucinated APIs</text></g>
  <g transform="translate(800,440)"><rect width="260" height="56" rx="10" fill="url(#boxGradient)" stroke="#10B981" stroke-width="2"/><rect width="6" height="56" rx="3" fill="#10B981"/><text x="20" y="26" font-size="15" font-weight="700" fill="#F1F5F9">Route Out Honestly</text><text x="20" y="44" font-size="12" fill="#6EE7B7">when scope exceeded</text></g>
</svg>
