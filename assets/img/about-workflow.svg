<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">From question to reliable product</title>
  <desc id="desc">Four stages: frame a question, retrieve evidence, build a system, and evaluate results. Evaluation feeds the next question.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#416279"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <g fill="#f0f7f7" stroke="#6b999b" stroke-width="2">
      <rect x="18" y="38" width="245" height="155" rx="18"/>
      <rect x="322" y="38" width="245" height="155" rx="18"/>
      <rect x="626" y="38" width="245" height="155" rx="18"/>
      <rect x="930" y="38" width="245" height="155" rx="18"/>
    </g>
    <g fill="#18575d" font-size="15" font-weight="700" letter-spacing="2">
      <text x="42" y="76">01 · QUESTION</text><text x="346" y="76">02 · EVIDENCE</text>
      <text x="650" y="76">03 · BUILD</text><text x="954" y="76">04 · EVALUATE</text>
    </g>
    <g fill="#172d3d" font-size="23" font-weight="700">
      <text x="42" y="114">Frame the problem</text><text x="346" y="114">Retrieve signal</text>
      <text x="650" y="114">Make it useful</text><text x="954" y="114">Inspect results</text>
    </g>
    <g fill="#345262" font-size="16">
      <text x="42" y="148">Goals and constraints</text><text x="346" y="148">Research and context</text>
      <text x="650" y="148">Tools and product</text><text x="954" y="148">Tests and feedback</text>
    </g>
    <g fill="none" stroke="#416279" stroke-width="3" marker-end="url(#arrow)">
      <path d="M266 115h48"/><path d="M570 115h48"/><path d="M874 115h48"/>
      <path d="M1052 203v40H140v-40"/>
    </g>
    <text x="490" y="273" fill="#345262" font-size="16" font-weight="600">Feedback informs the next question</text>
  </g>
</svg>
