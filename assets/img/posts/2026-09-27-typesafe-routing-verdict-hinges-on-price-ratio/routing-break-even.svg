<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><title id="t">Pure frontier vs routed path: relative cost per session</title><desc id="d">Four scenarios from the TypeSafe routing formula with Y=0.12 and Z=0.23. With the notes prices (Opus 5/25, Sonnet 3/15) routing costs more in both a long session (6.19 vs 4.15) and an empty context (4.24 vs 4.15). With newer prices (Opus 5.5 4/20, Sonnet 5 2/10) routing costs more in a long session (4.36 vs 3.32) but less with an empty context (3.06 vs 3.32).</desc><text x="70" y="34" font-size="20" font-weight="700" fill="#1f2937">Routing is priced per context rebuild, and the price ratio decides who wins</text><text x="70" y="58" font-size="13.5" fill="#4b5563">Relative cost per session from the notes’ formula, Y = 0.12 output, Z = 0.23 extra reads. Lower is cheaper.</text><line x1="62" x2="930" y1="360" y2="360" stroke="#9ca3af" stroke-opacity="0.35" stroke-width="1"/><text x="56" y="364" font-size="12" text-anchor="end" fill="#6b7280">0</text><line x1="62" x2="930" y1="285" y2="285" stroke="#9ca3af" stroke-opacity="0.35" stroke-width="1"/><text x="56" y="289" font-size="12" text-anchor="end" fill="#6b7280">2</text><line x1="62" x2="930" y1="210" y2="210" stroke="#9ca3af" stroke-opacity="0.35" stroke-width="1"/><text x="56" y="214" font-size="12" text-anchor="end" fill="#6b7280">4</text><line x1="62" x2="930" y1="135" y2="135" stroke="#9ca3af" stroke-opacity="0.35" stroke-width="1"/><text x="56" y="139" font-size="12" text-anchor="end" fill="#6b7280">6</text><rect x="90" y="204.375" width="58" height="155.625" rx="4" fill="#2563eb"/><rect x="158" y="127.87499999999997" width="58" height="232.12500000000003" rx="4" fill="#dc2626"/><text x="119" y="196.375" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">4.15</text><text x="187" y="119.87499999999997" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">6.19</text><text x="153" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Notes prices</text><text x="153" y="400" font-size="12.5" text-anchor="middle" fill="#4b5563">long session (X=0.65)</text><text x="153" y="420" font-size="12.5" font-weight="600" text-anchor="middle" fill="#dc2626">routing +49.2%</text><rect x="300" y="204.375" width="58" height="155.625" rx="4" fill="#2563eb"/><rect x="368" y="201" width="58" height="159" rx="4" fill="#dc2626"/><text x="329" y="196.375" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">4.15</text><text x="397" y="193" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">4.24</text><text x="363" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Notes prices</text><text x="363" y="400" font-size="12.5" text-anchor="middle" fill="#4b5563">empty context (X=0)</text><text x="363" y="420" font-size="12.5" font-weight="600" text-anchor="middle" fill="#dc2626">routing +2.2%</text><rect x="510" y="235.5" width="58" height="124.5" rx="4" fill="#2563eb"/><rect x="578" y="196.5" width="58" height="163.5" rx="4" fill="#dc2626"/><text x="539" y="227.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">3.32</text><text x="607" y="188.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">4.36</text><text x="573" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Newer prices</text><text x="573" y="400" font-size="12.5" text-anchor="middle" fill="#4b5563">long session (X=0.65)</text><text x="573" y="420" font-size="12.5" font-weight="600" text-anchor="middle" fill="#dc2626">routing +31.3%</text><rect x="720" y="235.5" width="58" height="124.5" rx="4" fill="#2563eb"/><rect x="788" y="245.25" width="58" height="114.75" rx="4" fill="#059669"/><text x="749" y="227.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">3.32</text><text x="817" y="237.25" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">3.06</text><text x="783" y="382" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Newer prices</text><text x="783" y="400" font-size="12.5" text-anchor="middle" fill="#4b5563">empty context (X=0)</text><text x="783" y="420" font-size="12.5" font-weight="600" text-anchor="middle" fill="#059669">routing -7.8%</text><rect x="70" y="433" width="14" height="14" rx="3" fill="#2563eb"/><text x="90" y="444" font-size="12.5" fill="#374151">Pure frontier (large model reads its own cached context)</text><rect x="460" y="433" width="14" height="14" rx="3" fill="#dc2626"/><rect x="477" y="433" width="14" height="14" rx="3" fill="#059669"/><text x="498" y="444" font-size="12.5" fill="#374151">Large → small → large route (red: costs more, green: costs less)</text></svg>