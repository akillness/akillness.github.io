<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Decision-model baseline before fine-tuning</title><desc id="desc">A decision model is benchmarked before optional fine-tuning; its output then passes through deterministic permission checks and an independent verifier.</desc>
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4efe7"/><stop offset="1" stop-color="#e8f0ee"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b53"/></marker></defs>
<rect x="0" y="0" width="1200" height="630" fill="url(#panel)"/>
<text x="72" y="88" fill="#243b53" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">SOURCE AUDIT / DECISION MODELS</text>
<text x="72" y="153" fill="#142a3b" font-family="Arial, sans-serif" font-size="45" font-weight="700">Measure first. Fine-tune only</text><text x="72" y="207" fill="#142a3b" font-family="Arial, sans-serif" font-size="45" font-weight="700">when the baseline falls short.</text>
<g font-family="Arial, sans-serif"><rect x="74" y="285" width="214" height="130" rx="16" fill="#fff" stroke="#b9c9c4" stroke-width="2"/><text x="105" y="333" fill="#42645d" font-size="18" font-weight="700">1 / EVALUATE</text><text x="105" y="375" fill="#142a3b" font-size="25" font-weight="700">Base model</text>
<rect x="363" y="285" width="214" height="130" rx="16" fill="#fff" stroke="#b9c9c4" stroke-width="2"/><text x="394" y="333" fill="#42645d" font-size="18" font-weight="700">2 / COMPARE</text><text x="394" y="375" fill="#142a3b" font-size="25" font-weight="700">Fine-tune</text>
<rect x="652" y="285" width="214" height="130" rx="16" fill="#fff" stroke="#e3b35a" stroke-width="2"/><text x="683" y="333" fill="#9a6416" font-size="18" font-weight="700">3 / CONTROL</text><text x="683" y="375" fill="#142a3b" font-size="25" font-weight="700">Permissions</text>
<rect x="941" y="285" width="214" height="130" rx="16" fill="#fff" stroke="#b9c9c4" stroke-width="2"/><text x="972" y="333" fill="#42645d" font-size="18" font-weight="700">4 / VERIFY</text><text x="972" y="375" fill="#142a3b" font-size="25" font-weight="700">Completion</text></g>
<path d="M 294 350 L 353 350" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/><path d="M 583 350 L 642 350" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/><path d="M 872 350 L 931 350" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/>
<text x="74" y="500" fill="#42645d" font-family="Arial, sans-serif" font-size="21">A model score can rank options. It cannot grant authority or verify its own side effects.</text>
</svg>
