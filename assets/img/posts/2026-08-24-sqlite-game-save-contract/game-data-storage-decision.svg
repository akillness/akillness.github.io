<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Game data storage decisions with SQLite</title>
  <desc id="desc">An original diagram showing which game data is well suited to SQLite and which needs another storage approach.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0c1324"/>
      <stop offset="1" stop-color="#172a4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="90" r="230" fill="#38bdf8" opacity="0.08"/>
  <circle cx="130" cy="820" r="270" fill="#a78bfa" opacity="0.08"/>

  <text x="96" y="114" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="54" font-weight="700">Which Game Data Wants SQLite?</text>
  <text x="96" y="164" fill="#b8c7df" font-family="system-ui, sans-serif" font-size="25">Choose by write pattern, sync contract, and runtime ownership, not by database fashion.</text>

  <g filter="url(#shadow)">
    <rect x="96" y="232" width="440" height="510" rx="28" fill="#11213d" stroke="#255b8e" stroke-width="2"/>
    <rect x="580" y="232" width="440" height="510" rx="28" fill="#11213d" stroke="#255b8e" stroke-width="2"/>
    <rect x="1064" y="232" width="440" height="510" rx="28" fill="#11213d" stroke="#255b8e" stroke-width="2"/>
  </g>

  <text x="132" y="294" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="29" font-weight="700">Strong fit</text>
  <text x="616" y="294" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="29" font-weight="700">Good with a contract</text>
  <text x="1100" y="294" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="29" font-weight="700">Use another system</text>

  <g font-family="system-ui, sans-serif">
    <rect x="132" y="332" width="368" height="102" rx="18" fill="#163657"/>
    <text x="160" y="374" fill="#f8fafc" font-size="26" font-weight="650">Read-only content tables</text>
    <text x="160" y="408" fill="#c5d7ec" font-size="20">quests, items, dialogue, indexes</text>

    <rect x="132" y="456" width="368" height="102" rx="18" fill="#163657"/>
    <text x="160" y="498" fill="#f8fafc" font-size="26" font-weight="650">Offline telemetry buffer</text>
    <text x="160" y="532" fill="#c5d7ec" font-size="20">batch writes, upload later</text>

    <rect x="132" y="580" width="368" height="102" rx="18" fill="#163657"/>
    <text x="160" y="622" fill="#f8fafc" font-size="26" font-weight="650">Small local blobs</text>
    <text x="160" y="656" fill="#c5d7ec" font-size="20">thumbnails, chunk data, variants</text>

    <rect x="616" y="332" width="368" height="142" rx="18" fill="#164346"/>
    <text x="644" y="374" fill="#f8fafc" font-size="26" font-weight="650">Player save state</text>
    <text x="644" y="408" fill="#c5d7ec" font-size="20">checkpoint before cloud sync</text>
    <text x="644" y="440" fill="#c5d7ec" font-size="20">keep database and WAL together</text>

    <rect x="616" y="496" width="368" height="142" rx="18" fill="#164346"/>
    <text x="644" y="538" fill="#f8fafc" font-size="26" font-weight="650">Player-made content</text>
    <text x="644" y="572" fill="#c5d7ec" font-size="20">treat database input as untrusted</text>
    <text x="644" y="604" fill="#c5d7ec" font-size="20">validate and limit on load</text>

    <rect x="1100" y="332" width="368" height="142" rx="18" fill="#49361b"/>
    <text x="1128" y="374" fill="#f8fafc" font-size="26" font-weight="650">Large streamed assets</text>
    <text x="1128" y="408" fill="#d7c9af" font-size="20">textures, audio banks, video</text>
    <text x="1128" y="440" fill="#d7c9af" font-size="20">use pak files or asset bundles</text>

    <rect x="1100" y="496" width="368" height="142" rx="18" fill="#49361b"/>
    <text x="1128" y="538" fill="#f8fafc" font-size="26" font-weight="650">Authoritative multiplayer</text>
    <text x="1128" y="572" fill="#d7c9af" font-size="20">many concurrent writers</text>
    <text x="1128" y="604" fill="#d7c9af" font-size="20">use a client-server data service</text>
  </g>

  <path d="M536 487 H580" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
  <path d="M1020 487 H1064" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <text x="96" y="820" fill="#b8c7df" font-family="system-ui, sans-serif" font-size="23">SQLite is not a universal replacement. It is a durable local storage primitive with a clear concurrency and file-lifecycle contract.</text>
</svg>
