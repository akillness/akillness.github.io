<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax H3 19-release compatibility audit</title>
  <desc id="desc">Fifteen H3 adapters pass through task, runtime, sampler, and license gates, while four listed downloads are a full checkpoint, a Qwen prompt adapter, a latent upscaler, and a merged base model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1d36"/>
      <stop offset="1" stop-color="#122b46"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1060" cy="92" r="170" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="95" cy="610" r="210" fill="#2dd4bf" opacity="0.05"/>

  <text x="68" y="58" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">SOURCE AUDIT · AUGUST 2026</text>
  <text x="68" y="118" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800">19 DOWNLOADS ≠ ONE LoRA FOLDER</text>
  <text x="68" y="154" fill="#b8c6d9" font-family="Arial, Helvetica, sans-serif" font-size="20">The repository name is not the install contract.</text>

  <g filter="url(#shadow)">
    <rect x="68" y="198" width="666" height="342" rx="26" fill="#0b172a" stroke="#2f557a" stroke-width="2"/>
    <rect x="92" y="222" width="618" height="72" rx="18" fill="#10243e"/>
    <rect x="112" y="243" width="78" height="30" rx="15" fill="url(#cyan)"/>
    <text x="151" y="264" text-anchor="middle" fill="#06121f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">15</text>
    <text x="208" y="264" fill="#f1f5f9" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">actual H3 diffusion adapters</text>

    <text x="108" y="333" fill="#93a9c2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">THE FOUR GATES</text>

    <rect x="108" y="352" width="132" height="102" rx="16" fill="#112945" stroke="#38bdf8"/>
    <text x="174" y="382" text-anchor="middle" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">TASK FAMILY</text>
    <text x="174" y="411" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">FL2VA</text>
    <text x="174" y="434" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="15">or Ref2VA</text>

    <rect x="254" y="352" width="132" height="102" rx="16" fill="#112945" stroke="#2dd4bf"/>
    <text x="320" y="382" text-anchor="middle" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">RUNTIME</text>
    <text x="320" y="411" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">ComfyUI</text>
    <text x="320" y="434" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">LightX2V · DiffSynth</text>

    <rect x="400" y="352" width="132" height="102" rx="16" fill="#112945" stroke="#a78bfa"/>
    <text x="466" y="382" text-anchor="middle" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">SAMPLER</text>
    <text x="466" y="411" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">4 / 8 NFE</text>
    <text x="466" y="434" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">Euler · shifts · version</text>

    <rect x="546" y="352" width="132" height="102" rx="16" fill="#112945" stroke="#f59e0b"/>
    <text x="612" y="382" text-anchor="middle" fill="#fbbf24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">LICENSE</text>
    <text x="612" y="411" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Upstream</text>
    <text x="612" y="434" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">plus derivative terms</text>

    <path d="M174 470 H612" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="174" cy="470" r="6" fill="#38bdf8"/>
    <circle cx="320" cy="470" r="6" fill="#2dd4bf"/>
    <circle cx="466" cy="470" r="6" fill="#a78bfa"/>
    <circle cx="612" cy="470" r="6" fill="#f59e0b"/>
    <text x="393" y="508" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Pass all four before loading the weights</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="766" y="198" width="366" height="342" rx="26" fill="#1a1420" stroke="#874057" stroke-width="2"/>
    <text x="796" y="239" fill="#fda4af" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">FOUR CATEGORY ERRORS</text>

    <rect x="794" y="261" width="310" height="54" rx="14" fill="#2b1825"/>
    <circle cx="820" cy="288" r="14" fill="#fb7185"/>
    <text x="820" y="293" text-anchor="middle" fill="#2b0b15" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900">1</text>
    <text x="846" y="284" fill="#fff1f2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Z-Image-native</text>
    <text x="846" y="302" fill="#d8a6b4" font-family="Arial, Helvetica, sans-serif" font-size="13">full diffusion checkpoint / merge</text>

    <rect x="794" y="326" width="310" height="54" rx="14" fill="#2b1825"/>
    <circle cx="820" cy="353" r="14" fill="#fb7185"/>
    <text x="820" y="358" text-anchor="middle" fill="#2b0b15" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900">2</text>
    <text x="846" y="349" fill="#fff1f2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Prompt Rewriter 8B</text>
    <text x="846" y="367" fill="#d8a6b4" font-family="Arial, Helvetica, sans-serif" font-size="13">Qwen3-VL LoRA, not H3 LoRA</text>

    <rect x="794" y="391" width="310" height="54" rx="14" fill="#2b1825"/>
    <circle cx="820" cy="418" r="14" fill="#fb7185"/>
    <text x="820" y="423" text-anchor="middle" fill="#2b0b15" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900">3</text>
    <text x="846" y="414" fill="#fff1f2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Latent Upscaler</text>
    <text x="846" y="432" fill="#d8a6b4" font-family="Arial, Helvetica, sans-serif" font-size="13">standalone 3D-conv model</text>

    <rect x="794" y="456" width="310" height="54" rx="14" fill="#2b1825"/>
    <circle cx="820" cy="483" r="14" fill="#fb7185"/>
    <text x="820" y="488" text-anchor="middle" fill="#2b0b15" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900">4</text>
    <text x="846" y="479" fill="#fff1f2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">10Eros-Max</text>
    <text x="846" y="497" fill="#d8a6b4" font-family="Arial, Helvetica, sans-serif" font-size="13">merged / grafted base checkpoint</text>
  </g>

  <rect x="68" y="570" width="1064" height="66" rx="18" fill="#2a210d" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="96" y="598" fill="#fbbf24" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">LICENSE FIRST</text>
  <text x="96" y="621" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="17">The H3 community-license grant excludes the EU, UK, Republic of Korea, and USA.</text>
  <text x="1088" y="610" text-anchor="end" fill="#c8a95d" font-family="Arial, Helvetica, sans-serif" font-size="13">Read the upstream text · seek separate permission where required</text>
</svg>
