<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="480" y="52" fill="#f8fafc" font-size="28" font-weight="bold" text-anchor="middle">OpenMAIC: pedagogy as code, checked in two halves</text>
  <text x="480" y="80" fill="#94a3b8" font-size="15" text-anchor="middle">what the v1.0.0 announcement calls "20 built-in skills" is a prompt half plus a machine-checked half</text>

  <rect x="60" y="110" width="400" height="150" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
  <text x="260" y="140" fill="#e0e7ff" font-size="18" font-weight="bold" text-anchor="middle">SKILL.md (prose half)</text>
  <text x="260" y="168" fill="#c7d2fe" font-size="13" text-anchor="middle">teaching method, register, narration style</text>
  <text x="260" y="190" fill="#c7d2fe" font-size="13" text-anchor="middle">"cannot be checked here" — admitted in the sidecar</text>
  <text x="260" y="222" fill="#a5b4fc" font-size="12" text-anchor="middle">rides into the outline prompt</text>

  <rect x="500" y="110" width="400" height="150" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="700" y="140" fill="#ccfbf1" font-size="18" font-weight="bold" text-anchor="middle">outline-constraints.json (checked half)</text>
  <text x="700" y="168" fill="#99f6e4" font-size="13" text-anchor="middle">first scene: slide · slides &#8805; 65% · 1–3 quizzes</text>
  <text x="700" y="190" fill="#99f6e4" font-size="13" text-anchor="middle">checked against the model's outline output</text>
  <text x="700" y="222" fill="#5eead4" font-size="12" text-anchor="middle">violations return as re-plan diagnostics, never rewrites</text>

  <rect x="60" y="300" width="400" height="150" rx="12" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="260" y="330" fill="#ffedd5" font-size="18" font-weight="bold" text-anchor="middle">Frozen failure evals</text>
  <text x="260" y="358" fill="#fed7aa" font-size="13" text-anchor="middle">issue #511 &#8594; premature-end.json scenario</text>
  <text x="260" y="380" fill="#fed7aa" font-size="13" text-anchor="middle">deterministic END/not-END judge</text>
  <text x="260" y="412" fill="#fdba74" font-size="12" text-anchor="middle">no LLM-as-judge where a parser suffices</text>

  <rect x="500" y="300" width="400" height="150" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="700" y="330" fill="#fee2e2" font-size="18" font-weight="bold" text-anchor="middle">Bounded classroom inputs</text>
  <text x="700" y="358" fill="#fecaca" font-size="13" text-anchor="middle">.pptx: 8 MiB · 80 slides · 90 s · worker thread</text>
  <text x="700" y="380" fill="#fecaca" font-size="13" text-anchor="middle">session text &#8804; 100k chars (no upstream quota)</text>
  <text x="700" y="412" fill="#fca5a5" font-size="12" text-anchor="middle">aborted tool calls fenced out of persistence</text>

  <text x="480" y="505" fill="#64748b" font-size="12" text-anchor="middle">Original diagram · Fodev JEO Source Audit · pinned at THU-MAIC/OpenMAIC f6cf8fd4</text>
</svg>
