<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">OpenContext retrieval boundaries</title>
  <desc id="desc">Agent-directed manifest retrieval is separate from indexed search. Stable IDs point to current records, not historical snapshots.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2764A5" />
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #142B46; }
      .muted { fill: #50657B; }
      .small { font-size: 17px; letter-spacing: 1.6px; font-weight: 700; }
      .body { font-size: 22px; }
      .card { fill: #F8FAFC; stroke: #C8D4E0; stroke-width: 2; }
      .blue-card { fill: #EFF6FF; stroke: #95B8DF; stroke-width: 2; }
      .orange-card { fill: #FFF6E9; stroke: #E9BC7A; stroke-width: 2; }
      .green-card { fill: #EDF8F1; stroke: #9ACBAA; stroke-width: 2; }
    </style>
  </defs>

  <text x="60" y="70" class="ink" font-size="38" font-weight="750">OpenContext: follow the retrieval boundary</text>
  <text x="62" y="112" class="muted" font-size="22">A pinned-source schematic, not a runtime trace or product benchmark</text>
  <line x1="60" y1="142" x2="1340" y2="142" stroke="#D9E2EC" stroke-width="2" />

  <text x="62" y="182" class="small" fill="#2764A5">AGENT-DIRECTED RETRIEVAL · NOT AUTOMATIC PROMPT INJECTION</text>

  <rect x="60" y="210" width="355" height="235" rx="18" class="blue-card" />
  <circle cx="98" cy="250" r="22" fill="#2764A5" />
  <text x="98" y="257" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">01</text>
  <text x="133" y="258" class="ink" font-size="26" font-weight="700">Request a manifest</text>
  <text x="90" y="304" class="muted body">Generated guidance tells the</text>
  <text x="90" y="335" class="muted body">agent to ask for context entries.</text>
  <rect x="90" y="365" width="285" height="46" rx="10" fill="#FFFFFF" stroke="#C8D4E0" />
  <text x="109" y="395" fill="#2764A5" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">metadata list</text>

  <line x1="422" y1="327" x2="510" y2="327" stroke="#2764A5" stroke-width="4" marker-end="url(#arrow-blue)" />
  <text x="466" y="304" text-anchor="middle" class="muted" font-size="15">select</text>

  <rect x="520" y="210" width="355" height="235" rx="18" class="orange-card" />
  <circle cx="558" cy="250" r="22" fill="#B7651B" />
  <text x="558" y="257" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">02</text>
  <text x="593" y="258" class="ink" font-size="24" font-weight="700">Select relevant entries</text>
  <text x="550" y="304" class="muted body">ID · name · abs_path</text>
  <text x="550" y="335" class="muted body">description · update metadata</text>
  <rect x="550" y="365" width="295" height="46" rx="10" fill="#FFFFFF" stroke="#E9BC7A" />
  <text x="568" y="395" fill="#8A4B12" font-size="17">No note body or content hash here</text>

  <line x1="882" y1="327" x2="970" y2="327" stroke="#2764A5" stroke-width="4" marker-end="url(#arrow-blue)" />
  <text x="926" y="304" text-anchor="middle" class="muted" font-size="15">read</text>

  <rect x="980" y="210" width="355" height="235" rx="18" class="green-card" />
  <circle cx="1018" cy="250" r="22" fill="#26744A" />
  <text x="1018" y="257" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">03</text>
  <text x="1053" y="258" class="ink" font-size="26" font-weight="700">Read selected paths</text>
  <text x="1010" y="304" class="muted body">The agent opens chosen files.</text>
  <text x="1010" y="335" class="muted body">Markdown content comes from</text>
  <text x="1010" y="366" class="muted body">the file read, not the manifest.</text>

  <text x="62" y="495" class="small" fill="#50657B">TWO DISTINCT BOUNDARIES</text>

  <rect x="60" y="520" width="610" height="240" rx="18" class="card" />
  <text x="92" y="568" class="ink" font-size="25" font-weight="700">Stable ID is not version history</text>
  <text x="92" y="611" class="muted body">Move or rename: the current row keeps its ID.</text>
  <text x="92" y="645" class="muted body">Delete: the inspected path removes the row.</text>
  <text x="92" y="700" fill="#2764A5" font-size="18" font-weight="700">IDENTITY → CURRENT RECORD</text>

  <rect x="720" y="520" width="615" height="240" rx="18" class="card" />
  <text x="752" y="568" class="ink" font-size="25" font-weight="700">Indexed search is a separate path</text>
  <text x="752" y="611" class="muted body">Rust returns index_not_built for no index.</text>
  <text x="752" y="645" class="muted body">CLI output exposure is unverified.</text>
  <text x="752" y="676" class="muted body">Agent guidance suggests manifest + scoped</text>
  <text x="752" y="707" class="muted body">keyword search, not automatic CLI recovery.</text>
  <text x="752" y="744" fill="#B7651B" font-size="17" font-weight="700">SEARCH INDEX ≠ FILE-READ WORKFLOW</text>

  <text x="62" y="798" class="muted" font-size="18">Not represented: automatic retrieval on every task, measured accuracy, time saved, or end-to-end freshness.</text>
</svg>
