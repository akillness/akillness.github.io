<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="osmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="arnisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="mcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="840" height="440" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Badge -->
  <rect x="36" y="24" width="165" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="46" y="42" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="0.05em">VOXEL PIPELINE</text>
  <text x="36" y="76" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Arnis: 현실 공간에서 마인크래프트 1:1 복셀화 파이프라인</text>
  <text x="36" y="96" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#94a3b8">OpenStreetMap 벡터 지형 및 DEM 고도 데이터를 추출하여 마인크래프트 블록 매트릭스 변환</text>

  <!-- Stage 1: Data Ingestion -->
  <g transform="translate(36, 125)">
    <rect width="220" height="270" rx="10" fill="url(#osmGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1. 공간 데이터 수집</text>
    <line x1="20" y1="44" x2="200" y2="44" stroke="#047857" stroke-width="1"/>
    
    <text x="20" y="72" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#d1fae5">• OpenStreetMap (OSM)</text>
    <text x="20" y="92" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#a7f3d0">  Overpass API / PBF</text>
    <text x="20" y="108" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#a7f3d0">  building, highway, water</text>

    <text x="20" y="140" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#d1fae5">• 수치표고모델 (DEM)</text>
    <text x="20" y="160" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#a7f3d0">  SRTM / Copernicus 30m</text>
    <text x="20" y="176" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#a7f3d0">  실제 지형 고도 래스터</text>

    <text x="20" y="208" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#d1fae5">• 바운딩 박스 (BBox)</text>
    <text x="20" y="228" font-family="ui-monospace, monospace" font-size="10" fill="#fef08a">  min_lon,min_lat...</text>
  </g>
  <line x1="262" y1="260" x2="295" y2="260" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Arnis Engine Core -->
  <g transform="translate(305, 125)">
    <rect width="230" height="270" rx="10" fill="url(#arnisGrad)" stroke="#6366f1" stroke-width="2"/>
    <text x="20" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2. Arnis Rust 엔진</text>
    <line x1="20" y1="44" x2="210" y2="44" stroke="#4338ca" stroke-width="1"/>

    <text x="20" y="72" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">• 3D 건물 돌출 및 지붕</text>
    <text x="20" y="92" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#c7d2fe">  levels x 3.5m, gabled/dome</text>

    <text x="20" y="124" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">• 도로 및 보행로 망 생성</text>
    <text x="20" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#c7d2fe">  차선, 인도, 레일, 수로 굴착</text>

    <text x="20" y="176" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">• 블록 팔레트 매핑</text>
    <text x="20" y="196" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#c7d2fe">  JSON 재질 매핑 규칙 적용</text>

    <text x="20" y="228" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">• 복셀 좌표계 투영</text>
    <text x="20" y="248" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#fef08a">  1m 실측 = 1 마인크래프트 블록</text>
  </g>
  <line x1="542" y1="260" x2="575" y2="260" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Minecraft Artifacts -->
  <g transform="translate(585, 125)">
    <rect width="220" height="270" rx="10" fill="url(#mcGrad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">3. 마인크래프트 산출물</text>
    <line x1="20" y1="44" x2="200" y2="44" stroke="#b45309" stroke-width="1"/>

    <text x="20" y="76" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">• 완전 독립 월드 세이브</text>
    <text x="20" y="96" font-family="ui-monospace, monospace" font-size="10" fill="#fde68a">  level.dat + region/*.mca</text>
    <text x="20" y="112" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#fed7aa">  Y=-64 ~ 320 확장 고도 적용</text>

    <text x="20" y="150" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">• WorldEdit 스키매틱</text>
    <text x="20" y="170" font-family="ui-monospace, monospace" font-size="10" fill="#fde68a">  *.schem 파일 형식</text>
    <text x="20" y="186" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#fed7aa">  서버에 //schem load로 붙여넣기</text>

    <text x="20" y="224" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">• 즉각적 탐험 가능</text>
    <text x="20" y="244" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#fed7aa">  현실 도시 1:1 탐험 및 건축</text>
  </g>
</svg>
