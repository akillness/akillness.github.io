<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="600" y="58" text-anchor="middle" fill="#e2e8f0" font-size="34" font-weight="bold">God&#8217;s Eye View: the globe is the demo</text>
  <text x="600" y="94" text-anchor="middle" fill="#94a3b8" font-size="22">the boundaries are the product &#8212; audited at commit 314a0e1</text>

  <!-- World feeds -->
  <rect x="40" y="150" width="250" height="330" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="165" y="185" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Public world feeds</text>
  <text x="165" y="215" text-anchor="middle" fill="#94a3b8" font-size="15">untrusted data</text>
  <g fill="#cbd5e1" font-size="15">
    <text x="60" y="250">&#9992; OpenSky / adsb.lol</text>
    <text x="60" y="278">&#128674; AISStream vessels</text>
    <text x="60" y="306">&#128752; CelesTrak TLEs</text>
    <text x="60" y="334">&#127758; USGS / FIRMS / OSM</text>
    <text x="60" y="362">&#128247; Austin / TfL / Caltrans CCTV</text>
    <text x="60" y="390">&#128251; Radio Browser</text>
    <text x="60" y="418">&#128225; TomTom / Open-Meteo</text>
    <text x="60" y="446">&#128240; Google News RSS</text>
  </g>

  <!-- Boundary 1: key broker -->
  <rect x="360" y="150" width="330" height="330" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="3"/>
  <text x="525" y="185" text-anchor="middle" fill="#93c5fd" font-size="20" font-weight="bold">Boundary 1 &#183; process</text>
  <text x="525" y="213" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="bold">localhost key broker</text>
  <g fill="#cbd5e1" font-size="15">
    <text x="380" y="248">vite.config.js &#8212; 7,383 lines</text>
    <text x="380" y="276">24 /api/* server endpoints</text>
    <text x="380" y="304">holds OpenAI / OpenSky /</text>
    <text x="380" y="326">AISStream secrets server-side</text>
    <text x="380" y="354">mints ephemeral Realtime tokens</text>
    <text x="380" y="382">SSRF + DNS-rebinding defenses</text>
    <text x="380" y="410">opt-in per-IP rate limits</text>
    <text x="380" y="438">binds to localhost by default</text>
  </g>

  <!-- Boundary 2: model -->
  <rect x="760" y="150" width="400" height="160" rx="14" fill="#14532d" stroke="#22c55e" stroke-width="3"/>
  <text x="960" y="185" text-anchor="middle" fill="#86efac" font-size="20" font-weight="bold">Boundary 2 &#183; model</text>
  <g fill="#cbd5e1" font-size="15">
    <text x="780" y="218">voice model sees feed text as context,</text>
    <text x="780" y="244">acts only through a closed dispatcher:</text>
    <text x="780" y="272" fill="#f8fafc" font-weight="bold">28 named tools in gevActions.js</text>
    <text x="780" y="296">model output treated as untrusted</text>
  </g>

  <!-- Boundary 3: license -->
  <rect x="760" y="330" width="400" height="150" rx="14" fill="#57250f" stroke="#f97316" stroke-width="3"/>
  <text x="960" y="365" text-anchor="middle" fill="#fdba74" font-size="20" font-weight="bold">Boundary 3 &#183; license</text>
  <g fill="#cbd5e1" font-size="15">
    <text x="780" y="398">MIT covers the source code only</text>
    <text x="780" y="424">bundled data keeps its own terms:</text>
    <text x="780" y="450" fill="#f8fafc" font-weight="bold">CC BY-NC-SA / ODbL / non-commercial</text>
  </g>

  <!-- Arrows -->
  <line x1="290" y1="315" x2="352" y2="315" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="690" y1="230" x2="752" y2="230" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="690" y1="400" x2="752" y2="400" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="600" y="560" text-anchor="middle" fill="#64748b" font-size="16">Browser renders the photorealistic globe &#8212; but never holds a long-lived secret.</text>
  <text x="600" y="590" text-anchor="middle" fill="#64748b" font-size="16">Source audit: github.com/bilawalsidhu/gods-eye-view @ 314a0e1 (MIT code / carved-out data)</text>
</svg>
