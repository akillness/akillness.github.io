<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">NemoClaw’s Personal tier is broader than web access</title>
  <desc id="desc">A conceptual diagram of NemoClaw’s one-host early-preview stack. An agent runs in an OpenShell sandbox, which connects through a gateway to managed inference and policy-controlled network destinations. The Personal tier permits every sandbox binary to use TCP on destination ports 80 and 443 through Layer 4 pass-through, not an HTTP-only filter. Unspecified, loopback, and link-local ranges are excluded; other ports need another rule. Other control layers remain active.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#326b9a"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b54444"/></marker>
  </defs>
  <text x="48" y="52" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2.4" fill="#326b9a">SOURCE AUDIT · NEMOCLAW</text>
  <text x="48" y="108" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#162332">The Personal tier changes the egress boundary</text>
  <text x="48" y="146" font-family="Inter, Arial, sans-serif" font-size="22" fill="#566477">A policy choice, not a blanket guarantee of safety.</text>

  <rect x="40" y="182" width="760" height="444" rx="24" fill="#f4f7fa" stroke="#8192a5" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="68" y="222" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.2" fill="#435367">ONE HOST · TRUSTED OPERATOR</text>
  <rect x="68" y="246" width="310" height="250" rx="18" fill="#ffffff" stroke="#7d9bb8" stroke-width="2"/>
  <text x="92" y="284" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#162332">OpenShell sandbox</text>
  <rect x="92" y="306" width="262" height="94" rx="12" fill="#e9f1f8"/>
  <text x="112" y="342" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#244e73">Agent runtime</text>
  <text x="112" y="368" font-family="Inter, Arial, sans-serif" font-size="17" fill="#435367">OpenClaw · Hermes</text>
  <text x="112" y="391" font-family="Inter, Arial, sans-serif" font-size="17" fill="#435367">LangChain Deep Agents Code</text>
  <text x="92" y="432" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#566477">FILESYSTEM · PROCESS</text>
  <text x="92" y="462" font-family="Inter, Arial, sans-serif" font-size="16" fill="#566477">Other sandbox controls remain active.</text>

  <rect x="424" y="246" width="340" height="250" rx="18" fill="#ffffff" stroke="#7d9bb8" stroke-width="2"/>
  <text x="450" y="284" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#162332">OpenShell gateway</text>
  <text x="450" y="320" font-family="Inter, Arial, sans-serif" font-size="17" fill="#435367">Network policy · approvals</text>
  <text x="450" y="348" font-family="Inter, Arial, sans-serif" font-size="17" fill="#435367">Gateway authentication</text>
  <text x="450" y="376" font-family="Inter, Arial, sans-serif" font-size="17" fill="#435367">Host-side credential broker</text>
  <rect x="450" y="394" width="288" height="66" rx="12" fill="#edf4f1"/>
  <text x="470" y="422" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2d6a55">BASELINE: DENY UNLISTED EGRESS</text>
  <text x="470" y="446" font-family="Inter, Arial, sans-serif" font-size="15" fill="#435367">Tiers and approvals can widen it.</text>

  <path d="M380 370 H414" fill="none" stroke="#326b9a" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="842" y="238" width="314" height="116" rx="16" fill="#edf4f1" stroke="#6b9e89" stroke-width="2"/>
  <text x="868" y="276" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#245d4a">Hosted inference provider</text>
  <text x="868" y="307" font-family="Inter, Arial, sans-serif" font-size="17" fill="#435367">OpenShell mediates the route;</text>
  <text x="868" y="332" font-family="Inter, Arial, sans-serif" font-size="17" fill="#435367">the selected service handles requests.</text>
  <path d="M766 300 H830" fill="none" stroke="#326b9a" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="842" y="386" width="314" height="172" rx="16" fill="#fff2ef" stroke="#c77a70" stroke-width="2"/>
  <text x="868" y="424" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#8d3434">Personal egress</text>
  <text x="868" y="457" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#8d3434">Any sandbox binary</text>
  <text x="868" y="488" font-family="Inter, Arial, sans-serif" font-size="18" fill="#435367">TCP · destination ports 80 / 443</text>
  <text x="868" y="519" font-family="Inter, Arial, sans-serif" font-size="16" fill="#435367">L4 pass-through; not HTTP-only.</text>
  <path d="M766 430 H830" fill="none" stroke="#b54444" stroke-width="4" marker-end="url(#arrow-red)"/>

  <text x="68" y="548" font-family="Inter, Arial, sans-serif" font-size="17" fill="#566477">Early preview for a trusted operator on one host; not a hosted, multi-tenant control plane.</text>
  <rect x="40" y="650" width="1116" height="74" rx="14" fill="#162332"/>
  <text x="66" y="681" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">LIMITS STILL APPLY</text>
  <text x="66" y="707" font-family="Inter, Arial, sans-serif" font-size="16" fill="#e6edf5">Unspecified, loopback, and link-local ranges are excluded; other ports need another rule. Conceptual diagram.</text>
</svg>
