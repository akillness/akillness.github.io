<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="840" height="460" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Header Badge & Title -->
  <rect x="36" y="24" width="168" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="46" y="42" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="0.05em">TRAINING PIPELINE</text>
  <text x="36" y="78" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">MiniMind 4단계 엔드투엔드 훈련 파이프라인</text>
  <text x="36" y="98" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#94a3b8">원시 말뭉치부터 DPO 인간 선호도 정렬 및 엣지 추론 모델까지</text>

  <!-- Card 1: Pretrain -->
  <g transform="translate(36, 124)">
    <rect width="170" height="280" rx="10" fill="url(#blueCard)" stroke="#0284c7" stroke-width="2"/>
    <rect x="14" y="16" width="30" height="20" rx="4" fill="#0284c7"/>
    <text x="24" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">01</text>
    <text x="52" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Phase 1: 사전 훈련</text>
    <text x="14" y="60" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#7dd3fc">train_pretrain.py</text>
    <line x1="14" y1="72" x2="156" y2="72" stroke="#334155" stroke-width="1"/>
    
    <text x="14" y="94" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 인과적 언어 모델링</text>
    <text x="14" y="112" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  Causal Next-Token</text>
    
    <text x="14" y="140" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 손실 함수 및 가중치</text>
    <text x="14" y="158" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  전체 시퀀스 Cross-Entropy</text>
    
    <text x="14" y="186" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 최적화 스케줄러</text>
    <text x="14" y="204" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  AdamW + Cosine Warmup</text>
    
    <rect x="14" y="234" width="142" height="30" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
    <text x="24" y="253" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">출력: Base Checkpoint</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="212" y1="264" x2="230" y2="264" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 2: SFT / LoRA -->
  <g transform="translate(236, 124)">
    <rect width="170" height="280" rx="10" fill="url(#blueCard)" stroke="#0d9488" stroke-width="2"/>
    <rect x="14" y="16" width="30" height="20" rx="4" fill="#0d9488"/>
    <text x="24" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">02</text>
    <text x="52" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf">Phase 2: 지시 튜닝</text>
    <text x="14" y="60" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#5eead4">train_full_sft / lora</text>
    <line x1="14" y1="72" x2="156" y2="72" stroke="#334155" stroke-width="1"/>
    
    <text x="14" y="94" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 대화형 Q&amp;A 학습</text>
    <text x="14" y="112" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  User-Assistant 페어</text>
    
    <text x="14" y="140" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 프롬프트 마스킹</text>
    <text x="14" y="158" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#fbbf24">  질문 레이블 -100 배제</text>
    
    <text x="14" y="186" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 경량 LoRA 어댑터</text>
    <text x="14" y="204" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  4GB VRAM 환경 구동</text>
    
    <rect x="14" y="234" width="142" height="30" rx="6" fill="#134e4a" stroke="#0d9488" stroke-width="1"/>
    <text x="20" y="253" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf">출력: Instruct Checkpoint</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="412" y1="264" x2="430" y2="264" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 3: DPO -->
  <g transform="translate(436, 124)">
    <rect width="170" height="280" rx="10" fill="url(#blueCard)" stroke="#d97706" stroke-width="2"/>
    <rect x="14" y="16" width="30" height="20" rx="4" fill="#d97706"/>
    <text x="24" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">03</text>
    <text x="52" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Phase 3: DPO 정렬</text>
    <text x="14" y="60" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#fde68a">train_dpo.py</text>
    <line x1="14" y1="72" x2="156" y2="72" stroke="#334155" stroke-width="1"/>
    
    <text x="14" y="94" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 선호도 삼중항 데이터</text>
    <text x="14" y="112" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  {prompt, chosen, reject}</text>
    
    <text x="14" y="140" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 보상 모델 배제</text>
    <text x="14" y="158" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  암묵적 선호도 최적화</text>
    
    <text x="14" y="186" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 베타 온도 제어</text>
    <text x="14" y="204" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  β = 0.1~0.5 안정성 유지</text>
    
    <rect x="14" y="234" width="142" height="30" rx="6" fill="#78350f" stroke="#d97706" stroke-width="1"/>
    <text x="24" y="253" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">출력: Aligned Checkpoint</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="612" y1="264" x2="630" y2="264" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 4: Reasoning & GGUF -->
  <g transform="translate(636, 124)">
    <rect width="170" height="280" rx="10" fill="url(#blueCard)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="14" y="16" width="30" height="20" rx="4" fill="#8b5cf6"/>
    <text x="24" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">04</text>
    <text x="52" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c4b5fd">Phase 4: 추론 &amp; 배포</text>
    <text x="14" y="60" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#ddd6fe">export_model.py</text>
    <line x1="14" y1="72" x2="156" y2="72" stroke="#334155" stroke-width="1"/>
    
    <text x="14" y="94" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 추론 모드 증류</text>
    <text x="14" y="112" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  &lt;think&gt;...&lt;/think&gt; 토큰</text>
    
    <text x="14" y="140" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• GGUF 포맷 변환</text>
    <text x="14" y="158" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  Q4_K_M 양자화 지원</text>
    
    <text x="14" y="186" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• 온디바이스 엣지 실행</text>
    <text x="14" y="204" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">  llama.cpp / Ollama 100+ t/s</text>
    
    <rect x="14" y="234" width="142" height="30" rx="6" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1"/>
    <text x="24" y="253" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">출력: Edge GGUF Artifact</text>
  </g>
</svg>
