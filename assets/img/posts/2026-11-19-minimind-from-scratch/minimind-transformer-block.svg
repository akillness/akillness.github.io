<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="normGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="attnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ffnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowResidual" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="840" height="520" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Badge -->
  <rect x="36" y="24" width="175" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="46" y="42" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="0.05em">MODEL ARCHITECTURE</text>
  <text x="36" y="76" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">MiniMind 트랜스포머 블록 내부 구조</text>
  <text x="36" y="96" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#94a3b8">Pre-RMSNorm, RoPE 회전 임베딩, SwiGLU 게이팅 피드포워드 결합</text>

  <!-- Left: Main Layer Stack -->
  <!-- 1. Input -->
  <g transform="translate(180, 115)">
    <rect width="280" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="140" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Input Hidden State x (Dim: 512 / 768)</text>
  </g>
  <line x1="320" y1="149" x2="320" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. RMSNorm 1 -->
  <g transform="translate(200, 172)">
    <rect width="240" height="32" rx="6" fill="url(#normGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="120" y="21" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff" text-anchor="middle">RMSNorm (Pre-Attention)</text>
  </g>
  <line x1="320" y1="204" x2="320" y2="225" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Residual 1 Bypass Path (Yellow) -->
  <path d="M 460 132 L 530 132 L 530 300 L 445 300" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowResidual)"/>
  <text x="538" y="220" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#fbbf24">Residual Add</text>

  <!-- 3. Attention Block -->
  <g transform="translate(180, 227)">
    <rect width="280" height="54" rx="8" fill="url(#attnGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Causal Multi-Head Self-Attention</text>
    <text x="140" y="42" font-family="ui-monospace, monospace" font-size="11" fill="#bae6fd" text-anchor="middle">+ RoPE (Rotary Position Embeddings)</text>
  </g>
  <line x1="320" y1="281" x2="320" y2="295" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Residual Add 1 Circle -->
  <circle cx="320" cy="305" r="12" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
  <text x="320" y="309" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">+</text>
  <line x1="320" y1="317" x2="320" y2="335" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. RMSNorm 2 -->
  <g transform="translate(200, 337)">
    <rect width="240" height="32" rx="6" fill="url(#normGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="120" y="21" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff" text-anchor="middle">RMSNorm (Pre-FFN)</text>
  </g>
  <line x1="320" y1="369" x2="320" y2="388" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Residual 2 Bypass Path (Yellow) -->
  <path d="M 460 305 L 530 305 L 530 465 L 445 465" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowResidual)"/>

  <!-- 5. SwiGLU FFN -->
  <g transform="translate(180, 390)">
    <rect width="280" height="54" rx="8" fill="url(#ffnGrad)" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="140" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">SwiGLU Gated Feed-Forward Network</text>
    <text x="140" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Gate(x) ⊗ Up(x) -> Down(x) (Hidden: ~1376)</text>
  </g>
  <line x1="320" y1="444" x2="320" y2="458" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Residual Add 2 Circle -->
  <circle cx="320" cy="470" r="12" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
  <text x="320" y="474" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">+</text>
  <line x1="320" y1="482" x2="320" y2="500" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: Feature Callout Panel -->
  <g transform="translate(600, 115)">
    <rect width="205" height="375" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <text x="16" y="28" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">주요 핵심 메커니즘</text>
    <line x1="16" y1="38" x2="189" y2="38" stroke="#334155" stroke-width="1"/>
    
    <text x="16" y="60" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8">1. RMSNorm 프리정규화</text>
    <text x="16" y="76" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">평균 계산 오버헤드 제거</text>
    <text x="16" y="90" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">학습 속도 15% 이상 가속</text>
    
    <text x="16" y="125" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">2. RoPE 회전 임베딩</text>
    <text x="16" y="141" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">2D 복소 회전 내적 계산</text>
    <text x="16" y="155" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">상대적 토큰 거리 보존</text>
    <text x="16" y="169" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">문맥 길이 일반화 우수</text>
    
    <text x="16" y="205" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2dd4bf">3. SwiGLU 게이팅 FFN</text>
    <text x="16" y="221" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">Gate와 Up 프로젝션 곱</text>
    <text x="16" y="235" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">파라미터당 표현력 극대화</text>
    
    <text x="16" y="270" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">4. 잔차 연결 (Residual)</text>
    <text x="16" y="286" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">그래디언트 소실 차단</text>
    <text x="16" y="300" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">안정적인 심층 학습 보장</text>
  </g>
</svg>
