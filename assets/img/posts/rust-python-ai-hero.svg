<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Python and Rust in an AI system</title>
  <desc id="description">A conceptual architecture diagram showing Python orchestration connected through a PyO3 and Maturin interface to Rust-native compute kernels.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#91a4c2"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect x="38" y="32" width="1124" height="566" rx="28" fill="#111a2b" stroke="#283650" stroke-width="2"/>
  <text x="76" y="86" fill="#8fa3c2" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" letter-spacing="2.2">AI SYSTEMS / PERFORMANCE</text>
  <text x="76" y="151" fill="#f4f7fb" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="750">Python + Rust</text>
  <text x="76" y="194" fill="#aebbd0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">Split the work at the native interface.</text>

  <rect x="76" y="264" width="300" height="238" rx="20" fill="#152540" stroke="#3c70c8" stroke-width="2"/>
  <rect x="76" y="264" width="300" height="8" rx="4" fill="#5f9cff"/>
  <text x="104" y="319" fill="#76aaff" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">APPLICATION LAYER</text>
  <text x="104" y="365" fill="#f4f7fb" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="700">Python</text>
  <text x="104" y="411" fill="#c1cde0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Model APIs and orchestration</text>
  <text x="104" y="443" fill="#c1cde0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Rapid ML prototyping</text>

  <line x1="388" y1="386" x2="437" y2="386" stroke="#91a4c2" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="450" y="264" width="300" height="238" rx="20" fill="#292337" stroke="#bd8752" stroke-width="2"/>
  <rect x="450" y="264" width="300" height="8" rx="4" fill="#f0ad68"/>
  <text x="478" y="319" fill="#f0ad68" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">FFI BOUNDARY</text>
  <text x="478" y="365" fill="#f4f7fb" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">PyO3 + Maturin</text>
  <text x="478" y="411" fill="#d5c9bd" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Calls cross the FFI</text>
  <text x="478" y="443" fill="#d5c9bd" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Optional GIL release</text>
  <text x="478" y="475" fill="#d5c9bd" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">for native CPU work</text>

  <line x1="762" y1="386" x2="811" y2="386" stroke="#91a4c2" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="824" y="264" width="300" height="238" rx="20" fill="#142b2a" stroke="#3d9c87" stroke-width="2"/>
  <rect x="824" y="264" width="300" height="8" rx="4" fill="#55c7a7"/>
  <text x="852" y="319" fill="#69d7b5" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">NATIVE COMPUTE</text>
  <text x="852" y="365" fill="#f4f7fb" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="700">Rust kernels</text>
  <text x="852" y="411" fill="#c3d9d1" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">CPU-bound functions</text>
  <text x="852" y="443" fill="#c3d9d1" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Parallel work with owned data</text>

  <text x="76" y="550" fill="#8292ac" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Conceptual architecture · not a measured benchmark</text>
  <text x="1124" y="550" text-anchor="end" fill="#60718c" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">RUST / PYTHON</text>
</svg>
