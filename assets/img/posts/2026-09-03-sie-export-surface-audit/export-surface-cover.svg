<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Two-zone diagram of the SIE repository: an examples zone developed through public pull requests, and an engine zone delivered as a 300-file sync commit; the changelog cites PR #478 while the public sequence ends at #248, and no .github directory exists at v0.7.2">
  <style>
    .h { font: 700 44px 'Helvetica Neue', Arial, sans-serif; fill: #d95f02; }
    .sub { font: 400 22px 'Helvetica Neue', Arial, sans-serif; fill: #7f7f7f; }
    .zone { font: 700 26px 'Helvetica Neue', Arial, sans-serif; fill: #1b9e77; }
    .zone2 { font: 700 26px 'Helvetica Neue', Arial, sans-serif; fill: #d95f02; }
    .t { font: 400 21px 'Menlo', 'Courier New', monospace; fill: #666666; }
    .f { font: 400 20px 'Helvetica Neue', Arial, sans-serif; fill: #666666; }
    .box1 { fill: none; stroke: #1b9e77; stroke-width: 2.5; rx: 12; }
    .box2 { fill: none; stroke: #d95f02; stroke-width: 2.5; }
  </style>
  <text class="h" x="60" y="80">SIE's public repo is an export surface</text>
  <text class="sub" x="60" y="120">superlinked/sie audited at the v0.7.2 tag, commit 9a7e8d35</text>

  <rect class="box1" x="60" y="170" width="500" height="270" rx="12"/>
  <text class="zone" x="90" y="215">examples/ — developed in public</text>
  <text class="f" x="90" y="260">PR #209 merged 2026-07-31</text>
  <text class="f" x="90" y="295">PR #239 merged 2026-08-21</text>
  <text class="f" x="90" y="330">retrieval ablation with published losers</text>
  <text class="f" x="90" y="365">the v0.7.2 sync touched 0 files here</text>

  <rect class="box2" x="640" y="170" width="500" height="270" rx="12"/>
  <text class="zone2" x="670" y="215">packages/ — delivered by export</text>
  <text class="t" x="670" y="260">"sync source: v0.7.2"</text>
  <text class="f" x="670" y="295">1 commit, 1 parent, 300 files</text>
  <text class="f" x="670" y="330">231 files under packages/</text>
  <text class="f" x="670" y="365">changelog still headed v0.7.1</text>

  <text class="f" x="60" y="500">CHANGELOG cites PR #478 — the public issue/PR sequence ends at #248</text>
  <text class="f" x="60" y="540">No .github/ directory at v0.7.2: no workflow, no template, no CODEOWNERS</text>
  <text class="sub" x="60" y="595">akillness.github.io — Source Audit, 2026-09-03</text>
</svg>
