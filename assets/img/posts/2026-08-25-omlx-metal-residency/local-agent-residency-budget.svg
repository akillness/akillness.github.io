<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">A residency budget for local agent workloads</title>
  <desc id="desc">An original diagram separating interactive and batch local AI workloads, connected by a GPU scheduler that cannot preempt a running Metal kernel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#091826"/>
      <stop offset="1" stop-color="#102b3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.38"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <circle cx="1450" cy="75" r="250" fill="#22d3ee" opacity="0.08"/>
  <circle cx="100" cy="865" r="290" fill="#a78bfa" opacity="0.07"/>

  <text x="90" y="98" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="52" font-weight="700">A Local Agent Residency Budget</text>
  <text x="90" y="145" fill="#b8c7d9" font-family="system-ui, sans-serif" font-size="24">Separate interactive latency from batch throughput, then decide what stays resident in RAM, SSD, and the next GPU time slice.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="210" width="650" height="282" rx="28" fill="#103750" stroke="#38bdf8" stroke-width="2"/>
    <rect x="860" y="210" width="650" height="282" rx="28" fill="#273449" stroke="#a78bfa" stroke-width="2"/>
    <rect x="280" y="606" width="1040" height="190" rx="30" fill="#13383b" stroke="#34d399" stroke-width="2"/>
  </g>

  <g font-family="system-ui, sans-serif">
    <text x="130" y="268" fill="#7dd3fc" font-size="28" font-weight="700">Interactive lane</text>
    <text x="130" y="312" fill="#f8fafc" font-size="30" font-weight="650">Designer copilot and coding agent</text>
    <text x="130" y="352" fill="#c5d7e8" font-size="22">Target: short time to first token</text>
    <rect x="130" y="382" width="172" height="62" rx="14" fill="#174c6b"/><text x="161" y="421" fill="#e0f2fe" font-size="22" font-weight="600">Pin model</text>
    <rect x="324" y="382" width="186" height="62" rx="14" fill="#174c6b"/><text x="356" y="421" fill="#e0f2fe" font-size="22" font-weight="600">Hot KV tier</text>
    <rect x="532" y="382" width="164" height="62" rx="14" fill="#174c6b"/><text x="554" y="421" fill="#e0f2fe" font-size="22" font-weight="600">Fair decode</text>

    <text x="900" y="268" fill="#c4b5fd" font-size="28" font-weight="700">Batch lane</text>
    <text x="900" y="312" fill="#f8fafc" font-size="30" font-weight="650">Log triage and nightly generation</text>
    <text x="900" y="352" fill="#d6d1e8" font-size="22">Target: completed work per hour</text>
    <rect x="900" y="382" width="176" height="62" rx="14" fill="#3c375e"/><text x="925" y="421" fill="#ede9fe" font-size="22" font-weight="600">TTL unload</text>
    <rect x="1098" y="382" width="182" height="62" rx="14" fill="#3c375e"/><text x="1123" y="421" fill="#ede9fe" font-size="22" font-weight="600">SSD KV tier</text>
    <rect x="1302" y="382" width="164" height="62" rx="14" fill="#3c375e"/><text x="1327" y="421" fill="#ede9fe" font-size="22" font-weight="600">Batch more</text>

    <text x="322" y="667" fill="#86efac" font-size="29" font-weight="700">Shared constraint: the GPU needs cooperative time slices</text>
    <text x="322" y="713" fill="#f8fafc" font-size="28" font-weight="650">Long prefill is chunked so decode work can repay its time debt.</text>
    <text x="322" y="754" fill="#c7e7dc" font-size="22">Measure TTFT and throughput separately. A bigger prefill chunk can help one lane while making the other feel stalled.</text>
  </g>

  <path d="M415 492 C425 545 520 565 610 603" fill="none" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1185 492 C1175 545 1080 565 990 603" fill="none" stroke="#c4b5fd" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="90" y="866" fill="#b8c7d9" font-family="system-ui, sans-serif" font-size="20">Original diagram for this article. It illustrates a workload policy, not an oMLX benchmark or product interface.</text>
</svg>
