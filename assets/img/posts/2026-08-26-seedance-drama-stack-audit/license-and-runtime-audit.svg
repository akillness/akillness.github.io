<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Source audit of four AI short-drama production stacks</title>
  <desc id="desc">A comparison of Huobao Drama, Toonflow, waoowaoo, and Moyin Creator across licenses and runtime boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b12"/>
      <stop offset="0.55" stop-color="#11162a"/>
      <stop offset="1" stop-color="#180e23"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68e0ff"/>
      <stop offset="0.5" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#ff70c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1415" cy="60" r="300" fill="#7d4dff" opacity="0.09"/>
  <circle cx="120" cy="830" r="280" fill="#20c8e8" opacity="0.07"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="96" y="90" fill="#8ddff2" font-size="22" font-weight="700" letter-spacing="5">SOURCE AUDIT / 2026.08.26</text>
    <text x="96" y="174" fill="#ffffff" font-size="66" font-weight="800" letter-spacing="-2">FOUR AI DRAMA STACKS</text>
    <text x="96" y="220" fill="#b7bed1" font-size="26">Seedance 2.0 changed the models. It did not erase licenses, API bills, or review.</text>
    <rect x="96" y="260" width="1408" height="5" rx="2.5" fill="url(#rule)"/>

    <g filter="url(#shadow)">
      <rect x="96" y="316" width="684" height="190" rx="24" fill="#171c2e" stroke="#2f3959"/>
      <rect x="820" y="316" width="684" height="190" rx="24" fill="#171c2e" stroke="#2f3959"/>
      <rect x="96" y="536" width="684" height="190" rx="24" fill="#171c2e" stroke="#2f3959"/>
      <rect x="820" y="536" width="684" height="190" rx="24" fill="#171c2e" stroke="#2f3959"/>
    </g>

    <g>
      <circle cx="140" cy="363" r="10" fill="#ffcf66"/>
      <text x="168" y="375" fill="#ffffff" font-size="31" font-weight="750">HUOBAO DRAMA</text>
      <text x="136" y="423" fill="#ffcf66" font-size="21" font-weight="700">LICENSE: UNCLEAR / NC BADGE</text>
      <text x="136" y="463" fill="#aeb7cc" font-size="20">Docker orchestration, external image and video APIs</text>

      <circle cx="864" cy="363" r="10" fill="#85d8ff"/>
      <text x="892" y="375" fill="#ffffff" font-size="31" font-weight="750">TOONFLOW</text>
      <text x="860" y="423" fill="#85d8ff" font-size="21" font-weight="700">LICENSE: APACHE TEXT + RIDER</text>
      <text x="860" y="463" fill="#aeb7cc" font-size="20">Desktop or Docker, external LLM, image, and video APIs</text>

      <circle cx="140" cy="583" r="10" fill="#ff78b8"/>
      <text x="168" y="595" fill="#ffffff" font-size="31" font-weight="750">WAOOWAOO</text>
      <text x="136" y="643" fill="#ff78b8" font-size="21" font-weight="700">LICENSE: CC BY-NC-SA 4.0</text>
      <text x="136" y="683" fill="#aeb7cc" font-size="20">Docker and queues, external provider keys, early beta</text>

      <circle cx="864" cy="583" r="10" fill="#77e3b1"/>
      <text x="892" y="595" fill="#ffffff" font-size="31" font-weight="750">MOYIN CREATOR</text>
      <text x="860" y="643" fill="#77e3b1" font-size="21" font-weight="700">LICENSE: AGPL-3.0</text>
      <text x="860" y="683" fill="#aeb7cc" font-size="20">Desktop batch workflow, external provider keys</text>
    </g>

    <rect x="96" y="773" width="1408" height="74" rx="18" fill="#0b101d" stroke="#39415b"/>
    <text x="800" y="820" text-anchor="middle" fill="#f4f6fb" font-size="25" font-weight="650">Self-hosted interface is not the same as private generation.</text>
  </g>
</svg>
