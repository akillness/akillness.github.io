  <text class="ms" x="340" y="314">:1095 — “so it cannot go stale quietly”</text>
  <text class="n" x="900" y="306" text-anchor="end">612</text>

  <path class="arr" d="M480 344 L480 368" marker-end="url(#a)"/>

  <rect class="boxr" x="36" y="370" width="888" height="140" rx="10"/>
