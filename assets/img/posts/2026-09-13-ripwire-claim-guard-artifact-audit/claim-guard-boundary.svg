<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" width="960" height="540">
  <title id="title">Where ripwire's gate-count guard stops at commit 1cf3086e</title>
  <desc id="desc">The loop in test/regression.sh names 612 gate scripts. Eight marked sites in three source files are rewritten by docs/gatecount_build.py and asserted by test/manifestcheck.sh, and all eight read 612. Two committed build artifacts, ripwire-showcase.pptx and ripwire-showcase.pdf, sit outside that family and still read 606, because they were last rebuilt six hours and thirty-five minutes before the loop grew.</desc>

  <style>
    .h  { font: 600 19px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #10212e; }
    .l  { font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2b3a45; }
    .m  { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #10212e; }
    .ms { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #47596a; }
    .n  { font: 700 28px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f5132; }
    .nb { font: 700 28px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8a2b16; }
    .cap{ font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #5b6b78; letter-spacing: .07em; }
    .box{ fill: none; stroke: #9fb0bd; stroke-width: 1.4; }
    .boxg{ fill: none; stroke: #2f7d54; stroke-width: 1.6; }
    .boxr{ fill: none; stroke: #b4532f; stroke-width: 1.6; stroke-dasharray: 7 4; }
    .arr{ fill: none; stroke: #6b7d8a; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7d8a"/>
    </marker>
  </defs>

  <text class="h" x="36" y="42">One number, two publication surfaces</text>
  <text class="l" x="36" y="66">redhat-et/ripwire at commit 1cf3086e — the gate count, re-derived</text>

