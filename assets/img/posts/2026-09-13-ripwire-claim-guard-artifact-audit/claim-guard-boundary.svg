  <text class="m" x="54" y="150">test/regression.sh:271</text>
  <text class="ms" x="54" y="174">names on the for-loop line</text>
  <text class="n" x="346" y="164" text-anchor="end">612</text>

  <text class="ms" x="372" y="114">rewritten by</text>
  <path class="arr" d="M372 124 L460 124" marker-end="url(#a)"/>
  <rect class="box" x="468" y="104" width="320" height="40" rx="8"/>
  <text class="m" x="484" y="130">docs/gatecount_build.py:38</text>

  <path class="arr" d="M372 170 L460 170" marker-end="url(#a)"/>
  <text class="ms" x="374" y="190">asserted by</text>
  <rect class="box" x="468" y="150" width="320" height="40" rx="8"/>
  <text class="m" x="484" y="176">test/manifestcheck.sh:143</text>

  <rect class="boxg" x="36" y="228" width="888" height="116" rx="10"/>
  <text class="cap" x="56" y="254">INSIDE THE FAMILY — EIGHT MARKED SITES IN THREE SOURCE FILES</text>
  <text class="m" x="56" y="288">README.md:1800, :1802</text>
  <text class="m" x="56" y="314">docs/EVALS.md:24, :5837, :6849</text>
