<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Obsidian Second Brain rewrite paths</title>
  <desc id="desc">Ingest asks for confirmation by default. Reconcile directs automatic rewrites. The MCP replace_text helper writes without reading rewrite_policy. These paths do not share one enforced approval gate.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .head { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .note { font-size: 17px; font-weight: 650; }
    </style>
  </defs>
  <text class="title" x="36" y="48">Three routes can change an existing note</text>

  <rect x="36" y="90" width="300" height="150" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text class="head" x="60" y="130">Ingest command</text>
  <text class="body" x="60" y="168">Default: propose, then wait</text>
  <text class="body" x="60" y="196">`unattended` opts out</text>

  <rect x="390" y="90" width="300" height="150" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text class="head" x="414" y="130">Reconcile command</text>
  <text class="body" x="414" y="168">Clear winner: rewrite</text>
  <text class="body" x="414" y="196">No stated policy check</text>

  <rect x="744" y="90" width="300" height="150" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text class="head" x="768" y="130">MCP replace_text</text>
  <text class="body" x="768" y="168">Exact atomic replacement</text>
  <text class="body" x="768" y="196">Does not read the setting</text>

  <path d="M186 250V302H470" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M540 250V302" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M894 250V302H610" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="215" y="330" width="650" height="112" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text class="head" x="540" y="372" text-anchor="middle">One vault, separate write policies</text>
  <text class="note" x="540" y="408" text-anchor="middle">A prompt rule is not a shared authorization gate.</text>
</svg>
