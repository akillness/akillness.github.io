    <text x="480" y="498" font-size="17" font-weight="700" fill="#ab091e">agent_hook_install_failed.error_message &#8212; z.string().max(200)</text>
    <text x="480" y="525" font-size="14" fill="#1f2933" font-family="Menlo, monospace">EACCES: permission denied, open '/Users/&lt;name&gt;/.claude/settings.json'</text>
