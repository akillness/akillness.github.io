  <text x="60" y="505" font-size="18" fill="#52606d">82 events: enum / count /</text>
  <text x="60" y="528" font-size="18" fill="#52606d">regex-locked fields only</text>

  <text x="60" y="592" font-size="17" fill="#52606d">The only free-form field across all 83 event schemas carries error.message verbatim from 14 hook installers</text>
  <text x="60" y="616" font-size="17" fill="#52606d">that write inside the user's home directory &#8212; where Node fs errors embed the account username.</text>
