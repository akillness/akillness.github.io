<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Self-reenactment PSNR on NeRSemble separating the framework lever of 2.01 from the tracking lever of 1.44">
  <text x="60" y="52" fill="#111827" font-size="29" font-weight="bold">NPGA: two levers, measured separately</text>
  <text x="60" y="82" fill="#4b5563" font-size="16">Self-reenactment PSNR on NeRSemble. Bars: Table 1, six subjects. Footnote +0.49: Table 2 ablation, three-subject subset.</text>
  <text x="60" y="104" fill="#6b7280" font-size="14">arXiv:2405.19331v2 · horizontal axis starts at 26, so bar length exaggerates the difference — read the printed values</text>

  <line x1="300" y1="132" x2="300" y2="545" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 294 138 L 306 132 M 294 146 L 306 140" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <text x="300" y="572" fill="#94a3b8" font-size="13" text-anchor="middle">26</text>
  <text x="612" y="572" fill="#94a3b8" font-size="13" text-anchor="middle">28</text>
  <text x="924" y="572" fill="#94a3b8" font-size="13" text-anchor="middle">30</text>
  <line x1="612" y1="132" x2="612" y2="545" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="924" y1="132" x2="924" y2="545" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6"/>

  <text x="286" y="172" fill="#b45309" font-size="16" text-anchor="end" font-weight="bold">GHA + NPHM</text>
  <rect x="300" y="150" width="94" height="34" fill="#fdba74"/>
  <text x="406" y="172" fill="#7c2d12" font-size="16" font-weight="bold">26.60</text>

  <text x="286" y="242" fill="#334155" font-size="16" text-anchor="end">GHA</text>
  <rect x="300" y="220" width="126" height="34" fill="#cbd5e1"/>
  <text x="438" y="242" fill="#475569" font-size="16">26.81</text>

  <text x="286" y="312" fill="#334155" font-size="16" text-anchor="end">MVP</text>
  <rect x="300" y="290" width="186" height="34" fill="#cbd5e1"/>
  <text x="498" y="312" fill="#475569" font-size="16">27.19</text>

  <text x="286" y="382" fill="#334155" font-size="16" text-anchor="end">GaussianAvatars</text>
  <rect x="300" y="360" width="276" height="34" fill="#cbd5e1"/>
  <text x="588" y="382" fill="#475569" font-size="16">27.77</text>

  <text x="286" y="452" fill="#1d4ed8" font-size="16" text-anchor="end">NPGA with BFM</text>
  <rect x="300" y="430" width="440" height="34" fill="#93c5fd"/>
  <text x="752" y="452" fill="#1e3a8a" font-size="16">28.82</text>

  <text x="286" y="522" fill="#1d4ed8" font-size="16" text-anchor="end" font-weight="bold">NPGA</text>
  <rect x="300" y="500" width="665" height="34" fill="#2563eb"/>
  <text x="977" y="522" fill="#1e3a8a" font-size="16" font-weight="bold">30.26</text>

  <path d="M 1000 237 L 1014 237 L 1014 447 L 1000 447" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="1026" y="330" fill="#334155" font-size="16" font-weight="bold">+2.01</text>
  <text x="1026" y="350" fill="#64748b" font-size="13">framework,</text>
  <text x="1026" y="367" fill="#64748b" font-size="13">same BFM tracking</text>

  <path d="M 1000 447 L 1014 447 L 1014 517 L 1000 517" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1026" y="478" fill="#1d4ed8" font-size="16" font-weight="bold">+1.44</text>
  <text x="1026" y="498" fill="#64748b" font-size="13">MonoNPHM</text>
  <text x="1026" y="515" fill="#64748b" font-size="13">tracking</text>

  <text x="60" y="606" fill="#6b7280" font-size="14">Neither lever dominates. Swapping tracking into the old pipeline alone made it worse (26.60 &lt; 26.81), and the in-model add-ons add +0.49 on three subjects.</text>
</svg>
