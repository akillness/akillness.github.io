<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Resolution path for a .m file in open-code-review">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-family:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif}
      .h{font-size:27px;font-weight:700;fill:#0f172a}
      .l{font-size:17px;fill:#334155}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:#0f172a}
      .s{font-size:14px;fill:#64748b}
      .bx{fill:none;stroke:#94a3b8;stroke-width:2;rx:10}
      .ok{fill:none;stroke:#0f766e;stroke-width:2.5;rx:10}
      .bad{fill:none;stroke:#c2410c;stroke-width:2.5;rx:10}
    </style>
  </defs>
  <text class="t h" x="40" y="52">How a .m file picks its rule doc</text>
  <text class="t s" x="40" y="80">alibaba/open-code-review @ 438a5c2 — internal/config/rules</text>

  <rect class="bx" x="40" y="112" width="270" height="66"/>
  <text class="t m" x="60" y="140">src/model.m</text>
  <text class="t s" x="60" y="164">a file in the diff</text>

  <line x1="310" y1="145" x2="392" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect class="bx" x="394" y="112" width="330" height="66"/>
  <text class="t m" x="414" y="140">"**/*.m" → matlab.md</text>
  <text class="t s" x="414" y="164">system_rules.json glob layer</text>

  <line x1="724" y1="145" x2="806" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect class="bx" x="808" y="112" width="352" height="66"/>
  <text class="t m" x="828" y="140">peek first non-blank line</text>
  <text class="t s" x="828" y="164">sniffer.go — one read, no cache</text>

  <line x1="984" y1="178" x2="984" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect class="bx" x="700" y="230" width="460" height="62"/>
  <text class="t m" x="720" y="258">looksLikeObjC(line)</text>
  <text class="t s" x="720" y="280">strings.HasPrefix over 12 fixed prefixes</text>

  <line x1="820" y1="292" x2="560" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1040" y1="292" x2="1040" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect class="ok" x="240" y="354" width="470" height="118"/>
  <text class="t l" x="262" y="384">false → keeps matlab.md</text>
  <text class="t m" x="262" y="414">"", "% a comment", "x = 1;"</text>
  <text class="t m" x="262" y="440">"# an Octave comment"</text>
  <text class="t s" x="262" y="462">read error / timeout / missing file also land here</text>

  <rect class="bad" x="742" y="354" width="418" height="118"/>
  <text class="t l" x="764" y="384">true → rewrites to objc.md</text>
  <text class="t m" x="764" y="414">"#import" "#include" "#pragma"</text>
  <text class="t m" x="764" y="440">"#if" "#define" ... and 7 more</text>
  <text class="t s" x="764" y="462">an Octave comment with no space reaches here</text>
</svg>
