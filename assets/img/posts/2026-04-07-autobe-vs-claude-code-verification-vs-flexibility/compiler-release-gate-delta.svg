<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Evidence layers for reviewing an agent framework</title>
  <desc id="desc">A three-layer diagram separates release artifact identity, source-visible validation guards, and measured runtime reliability.</desc>
  <rect x="42" y="38" width="1116" height="604" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="86" y="104" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Verification is a ladder, not a headline</text>
  <text x="86" y="142" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="18">AutoBE release audit · exact artifacts → source guards → measured outcomes</text>

  <g transform="translate(90 196)">
    <rect width="310" height="330" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="48" cy="52" r="24" fill="#2563eb"/>
    <text x="48" y="60" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">1</text>
    <text x="88" y="60" fill="#1e3a8a" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">Artifact identity</text>
    <text x="28" y="116" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="20">0.30.5 → 0.31.1</text>
    <text x="28" y="154" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">134 members each</text>
    <text x="28" y="187" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">133 hashes match</text>
    <text x="28" y="220" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">1 package metadata delta</text>
    <line x1="28" y1="248" x2="282" y2="248" stroke="#bfdbfe"/>
    <text x="28" y="284" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Proves what shipped</text>
    <text x="28" y="311" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="16">Not how reliably it runs</text>
  </g>

  <path d="M420 360h58" stroke="#64748b" stroke-width="4"/>
  <path d="m466 347 18 13-18 13" fill="none" stroke="#64748b" stroke-width="4"/>

  <g transform="translate(445 196)">
    <rect width="310" height="330" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <circle cx="48" cy="52" r="24" fill="#059669"/>
    <text x="48" y="60" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">2</text>
    <text x="88" y="60" fill="#065f46" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">Source guard</text>
    <text x="28" y="116" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="19">write before complete</text>
    <text x="28" y="154" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">validator rejects early</text>
    <text x="28" y="187" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">realize helper builds/tests</text>
    <text x="28" y="220" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">cleanup call is inspectable</text>
    <line x1="28" y1="248" x2="282" y2="248" stroke="#a7f3d0"/>
    <text x="28" y="284" fill="#047857" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Proves control flow</text>
    <text x="28" y="311" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="16">Not generated-code quality</text>
  </g>

  <path d="M775 360h58" stroke="#64748b" stroke-width="4"/>
  <path d="m821 347 18 13-18 13" fill="none" stroke="#64748b" stroke-width="4"/>

  <g transform="translate(800 196)">
    <rect width="310" height="330" rx="20" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <circle cx="48" cy="52" r="24" fill="#d97706"/>
    <text x="48" y="60" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">3</text>
    <text x="88" y="60" fill="#92400e" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">Measured result</text>
    <text x="28" y="116" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="19">fixed task corpus</text>
    <text x="28" y="154" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">controlled environment</text>
    <text x="28" y="187" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">repeated runs + rubric</text>
    <text x="28" y="220" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">failure taxonomy</text>
    <line x1="28" y1="248" x2="282" y2="248" stroke="#fde68a"/>
    <text x="28" y="284" fill="#b45309" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Needed for reliability</text>
    <text x="28" y="311" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="16">Absent from this static audit</text>
  </g>

  <text x="600" y="598" text-anchor="middle" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">A release number and a guard are evidence layers—not a comparative benchmark.</text>
</svg>
