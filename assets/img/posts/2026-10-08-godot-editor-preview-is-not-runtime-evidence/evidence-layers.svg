<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">A proposed scene-review evidence packet</title><desc id="desc">Four distinct evidence layers. This is an authored explanation of a proposed QA packet, not a Godot runtime result.</desc><style>text{font-family:system-ui,sans-serif}.heading{fill:#26394b}@media(prefers-color-scheme:dark){.heading{fill:#e5edf5}}</style><text class="heading" x="36" y="48" font-size="32" font-weight="700">One viewport is not every evidence layer</text><text class="heading" x="36" y="80" font-size="20">Proposed review packet. Static source audit. No Godot execution.</text><g transform="translate(36,105)"><rect width="928" height="74" rx="12" fill="#26394b"/><text x="20" y="30" fill="#e5edf5" font-size="24" font-weight="700">1. Editor presentation</text><text x="20" y="57" fill="#c9d6e2" font-size="20">What this viewport showed</text></g><g transform="translate(36,196)"><rect width="928" height="74" rx="12" fill="#26394b"/><text x="20" y="30" fill="#e5edf5" font-size="24" font-weight="700">2. Scene resources</text><text x="20" y="57" fill="#c9d6e2" font-size="20">Which nodes and resource references are configured</text></g><g transform="translate(36,287)"><rect width="928" height="74" rx="12" fill="#26394b"/><text x="20" y="30" fill="#e5edf5" font-size="24" font-weight="700">3. Saved project revision</text><text x="20" y="57" fill="#c9d6e2" font-size="20">Which saved artifact the review identifies</text></g><g transform="translate(36,378)"><rect width="928" height="74" rx="12" fill="#26394b"/><text x="20" y="30" fill="#e5edf5" font-size="24" font-weight="700">4. Runtime capture</text><text x="20" y="57" fill="#c9d6e2" font-size="20">What the separately identified run rendered</text></g></svg>