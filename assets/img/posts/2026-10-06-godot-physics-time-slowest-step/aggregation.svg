<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="t d"><title id="t">Maximum versus sum of illustrative physics timing windows</title><desc id="d">Three synthetic timing windows of 2, 4 and 3 milliseconds. Maximum is 4 milliseconds and sum is 9 milliseconds. These are not runtime data.</desc><g fill="#24324a" font-family="sans-serif"><text x="35" y="42" font-size="25">Same samples. Different questions.</text><text x="35" y="75" font-size="16">Illustrative arithmetic only, not a Godot capture</text><text x="35" y="135" font-size="18">Window A</text><text x="35" y="187" font-size="18">Window B</text><text x="35" y="239" font-size="18">Window C</text></g><rect x="160" y="110" width="160" height="33" rx="4" fill="#6099b7"/><rect x="160" y="162" width="320" height="33" rx="4" fill="#c68537"/><rect x="160" y="214" width="240" height="33" rx="4" fill="#6099b7"/><g fill="#24324a" font-family="sans-serif" font-size="18"><text x="335" y="134">2 ms</text><text x="495" y="186">4 ms</text><text x="415" y="238">3 ms</text><text x="620" y="142">MAX: 4 ms</text><text x="620" y="196">SUM: 9 ms</text><text x="35" y="305">Physics Frame % at a 60 Hz interval: 4 / (1000 / 60) × 100 = 24%</text></g></svg>