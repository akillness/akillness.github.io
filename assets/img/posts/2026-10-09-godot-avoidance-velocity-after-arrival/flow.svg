<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">Godot desired velocity reaches avoidance through a target-submission gate</title>
<desc id="desc">Original static control-flow diagram, not a runtime trace. The NavigationAgent3D setter stores velocity. Internal physics forwards it only with a parent, a submitted target and enabled avoidance. The solver output is emitted by velocity_computed and the user's controller applies movement. Navigation completion clears the target flag and, when avoidance is enabled, zeros normal and forced avoidance velocity; assigning the same target again requests repathing.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#246c72"/></marker></defs>
<g font-family="Arial,sans-serif" fill="#20343b"><text x="42" y="48" font-size="26" font-weight="700">Desired velocity is an input, not movement</text><text x="42" y="78" font-size="17">NavigationAgent3D at ed1daf0b. Source-derived flow; no engine run performed.</text></g>
<g stroke="#246c72" stroke-width="2" fill="#f1f8f7"><rect x="42" y="116" width="204" height="130" rx="12"/><rect x="286" y="116" width="204" height="130" rx="12"/><rect x="530" y="116" width="204" height="130" rx="12"/><rect x="774" y="116" width="204" height="130" rx="12"/><rect x="1018" y="116" width="220" height="130" rx="12"/></g>
<g font-family="Arial,sans-serif" fill="#20343b" text-anchor="middle"><text x="144" y="148" font-size="19" font-weight="700">set_velocity</text><text x="144" y="179" font-size="16">Store desired vector</text><text x="144" y="205" font-size="16">Mark submitted</text><text x="388" y="148" font-size="19" font-weight="700">Physics gate</text><text x="388" y="176" font-size="15">Parent + submitted target</text><text x="388" y="202" font-size="15">+ avoidance enabled</text><text x="632" y="148" font-size="19" font-weight="700">Avoidance server</text><text x="632" y="179" font-size="16">Preferred velocity</text><text x="632" y="205" font-size="16">Compute steering</text><text x="876" y="148" font-size="19" font-weight="700">velocity_computed</text><text x="876" y="179" font-size="16">Emit safe_velocity</text><text x="876" y="205" font-size="16">to your callback</text><text x="1128" y="148" font-size="19" font-weight="700">Your controller</text><text x="1128" y="179" font-size="16">Assign body velocity</text><text x="1128" y="205" font-size="16">move_and_slide()</text></g>
<g stroke="#246c72" stroke-width="2.5" marker-end="url(#arrow)"><path d="M248 181H278"/><path d="M492 181H522"/><path d="M736 181H766"/><path d="M980 181H1010"/></g>
<path d="M388 246V282" fill="none" stroke="#a86b23" stroke-width="2"/>
<rect x="42" y="288" width="1196" height="88" rx="12" fill="#fff7e9" stroke="#a86b23" stroke-width="1.5"/>
<g font-family="Arial,sans-serif" fill="#65401a"><text x="64" y="319" font-size="19" font-weight="700">On completion: target flag = false; enabled avoidance gets zero normal and forced velocity.</text><text x="64" y="350" font-size="17">A later setter call alone does not reopen the gate. A new target submission does, but also requests repathing.</text></g>
<text x="42" y="411" font-family="Arial,sans-serif" font-size="15" fill="#52646a">Route-query layers, avoidance-object masks and physical collision remain separate responsibilities.</text>
</svg>
