name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Node.js dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d _site
        env:
          JEKYLL_ENV: production


      - name: Verify ads.txt matches the configured publisher
        run: |
          client=$(sed -n 's/^google_ad_client:[[:space:]]*"\{0,1\}\(ca-pub-[0-9]*\)"\{0,1\}.*/\1/p' _config.yml | head -1)
          if [ -z "$client" ]; then
            echo "google_ad_client is empty in _config.yml - ads are disabled, skipping ads.txt check."
            exit 0
          fi
          pub=${client#ca-}
          if [ ! -f _site/ads.txt ]; then
            echo "::error::google_ad_client is set to $client but _site/ads.txt was not built."
            exit 1
          fi
          if ! grep -qE "^google\.com,[[:space:]]*$pub,[[:space:]]*DIRECT" _site/ads.txt; then
            echo "::error::ads.txt has no DIRECT record for $pub (AdSense will report it as missing)."
            cat _site/ads.txt
            exit 1
          fi
          echo "ads.txt authorizes $pub"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external=true \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
