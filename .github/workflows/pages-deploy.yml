name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - README.md
      - LICENSE

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Node.js dependencies
        run: npm install

      - name: Verify editorial source boundaries
        run: |
          node tools/verify-editorial-boundaries.mjs
          node tools/validate-editorial-harness.mjs

      - name: Build assets
        run: npm run build

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d _site
        env:
          JEKYLL_ENV: production

      - name: Verify content quality and index boundaries
        run: node tools/verify-site-quality.mjs _site

      - name: Verify agent artifacts are neither tracked nor published
        run: |
          set -u
          status=0

          # 1) Machine-written records belong in the local stores (.jeo/), never in git.
          tracked=$(git ls-files -- _workspace graphify-out llm-wiki test-results .jeo .omc .survey .serena .gjc 'jeo-session-*.md')
          if [ -n "$tracked" ]; then
            echo "::error::Agent-generated records are tracked in git. Untrack with 'git rm -r --cached <path>' (files stay on disk):"
            echo "$tracked" | head -20
            status=1
          fi

          # 2) Nothing in the exclude list may survive into the published site.
          for p in _workspace graphify-out llm-wiki test-results .claude .agents \
                   AGENTS.md AGENTS.html CLAUDE.md CLAUDE.html \
                   persona.md persona.html docs/prompt.md docs/prompt.html \
                   USER.md USER.html IDENTITY.md IDENTITY.html \
                   resume_data.json extract_resume.js plan.md plan.html \
                   2026_naver_coding_test_guide.md 2026_naver_coding_test_guide.html; do
            if [ -e "_site/$p" ]; then
              echo "::error::_site/$p was published. Add it to the exclude: block in _config.yml."
              status=1
            fi
          done
          leaked=$(find _site -name 'jeo-session-*' -print)
          if [ -n "$leaked" ]; then
            echo "::error::A raw session transcript was published:"
            echo "$leaked"
            status=1
          fi

          # 3) Belt and braces: the sitemap must not invite crawlers into agent paths.
          # Anchored right after the host so legitimate pages like /tags/llm-wiki/ still pass.
          if [ -f _site/sitemap.xml ] && \
             grep -qE '<loc>https?://[^/]+/(_workspace|graphify-out|llm-wiki|jeo-session|\.claude|\.agents)' _site/sitemap.xml; then
            echo "::error::sitemap.xml lists agent-generated URLs:"
            grep -oE 'https?://[^/]+/(_workspace|graphify-out|llm-wiki|jeo-session|\.claude|\.agents)[^<]*' _site/sitemap.xml | head -20
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            echo "No agent-generated records are tracked or published."
          fi
          exit $status



      - name: Verify ads.txt matches the configured publisher
        run: |
          client=$(sed -n 's/^google_ad_client:[[:space:]]*"\{0,1\}\(ca-pub-[0-9]*\)"\{0,1\}.*/\1/p' _config.yml | head -1)
          if [ -z "$client" ]; then
            echo "google_ad_client is empty in _config.yml - ads are disabled, skipping ads.txt check."
            exit 0
          fi
          pub=${client#ca-}
          if [ ! -f _site/ads.txt ]; then
            echo "::error::google_ad_client is set to $client but _site/ads.txt was not built."
            exit 1
          fi
          if ! grep -qE "^google\.com,[[:space:]]*$pub,[[:space:]]*DIRECT" _site/ads.txt; then
            echo "::error::ads.txt has no DIRECT record for $pub (AdSense will report it as missing)."
            cat _site/ads.txt
            exit 1
          fi
          echo "ads.txt authorizes $pub"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external=true \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
